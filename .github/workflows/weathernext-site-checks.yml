name: WeatherNext site and plain navigation checks
on:
  push:
    branches: [main]
    paths: ['public/weather-fusion/**','src/weatherFusion.js','test/weather*.test.js','scripts/weatherNext*.js','.github/workflows/weathernext-site-checks.yml']
  pull_request:
    paths: ['public/weather-fusion/**','src/weatherFusion.js','test/weather*.test.js','scripts/weatherNext*.js','.github/workflows/weathernext-site-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weathernext-site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test test/weatherNextSite.test.js test/weatherComparisonRepairs.test.js test/weatherDashboardChanges.test.js
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/weatherNextSiteSmoke.js
      - run: node scripts/weatherTodayTileSmoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weathernext-site-browser-evidence
          path: /tmp/weathernext-site-qa
          retention-days: 7

  live:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for deployed flat navigation and WeatherNext site
        env:
          LIVE_URL: https://sun-nourie-live.onrender.com
        run: |
          for attempt in $(seq 1 90); do
            main="$(curl -fsSL --max-time 20 "$LIVE_URL/weather-fusion/?deploy=$GITHUB_SHA&n=$attempt" 2>/dev/null || true)"
            wn="$(curl -fsSL --max-time 20 "$LIVE_URL/weathernext/?deploy=$GITHUB_SHA&n=$attempt" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "$LIVE_URL/weather-fusion/weather-polish.css?v=mobile-repair-v1&n=$attempt" 2>/dev/null || true)"
            if printf '%s' "$main" | grep -Fq 'weather-polish.css?v=mobile-repair-v1' \
              && ! printf '%s' "$main" | grep -Fq 'jump-visual' \
              && printf '%s' "$main" | grep -Fq 'id="weathernext-site-link" href="/weathernext/"' \
              && printf '%s' "$wn" | grep -Fq 'data-build="wn-repair-20260925"' \
              && printf '%s' "$wn" | grep -Fq 'Everything Google publishes for forecasting' \
              && printf '%s' "$css" | grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))' \
              && printf '%s' "$css" | grep -Fq 'border:0'; then
              echo "Live Weather Nourie flat navigation and dedicated WeatherNext site are deployed."
              exit 0
            fi
            echo "Waiting for Render deployment ($attempt/90)"
            sleep 10
          done
          echo "Render did not deploy the verified WeatherNext/navigation build in time."
          exit 1
