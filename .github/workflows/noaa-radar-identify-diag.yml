name: NOAA Radar Identify Diagnostic
on:
  push:
    branches: ["diag/noaa-radar-identify"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NOAA ArcGIS radar pixels at storm time
        run: |
          python - <<'PY'
          import requests, json, datetime
          base='https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer'
          times=['2026-09-18T21:58:15Z','2026-09-18T22:02:18Z','2026-09-18T22:06:11Z','2026-09-18T22:18:10Z']
          coords=[(35.70,-78.62),(35.75,-78.55),(35.787,-78.4806),(35.82,-78.42),(35.87,-78.35)]
          for iso in times:
            epoch=int(datetime.datetime.fromisoformat(iso.replace('Z','+00:00')).timestamp()*1000)
            print('=== TIME',iso,epoch,'===')
            for lat,lon in coords:
              geom=json.dumps({'x':lon,'y':lat,'spatialReference':{'wkid':4326}},separators=(',',':'))
              p={'geometry':geom,'geometryType':'esriGeometryPoint','time':str(epoch),'returnGeometry':'false','returnCatalogItems':'true','returnAllPixelValues':'true','f':'pjson'}
              r=requests.get(base+'/identify',params=p,timeout=20)
              d=r.json()
              props=d.get('properties') or {}
              feats=((d.get('catalogItems') or {}).get('features') or [])
              attrs=feats[0].get('attributes',{}) if feats else {}
              print(lat,lon,'value=',d.get('value'),'Values=',props.get('Values'),'name=',attrs.get('name'),'valid=',attrs.get('idp_validtime'))
          PY
