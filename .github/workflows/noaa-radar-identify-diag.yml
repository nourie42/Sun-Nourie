name: NOAA Radar Identify Diagnostic
on:
  push:
    branches: ["diag/noaa-radar-identify"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query KRAX local radar at Knightdale
        run: |
          set -x
          for TIME in 2026-09-18T21:59:40.000Z 2026-09-18T22:05:39.000Z 2026-09-18T22:17:42.000Z; do
            URL="https://opengeo.ncep.noaa.gov/geoserver/krax/krax_sr_bref/ows?service=WMS&version=1.3.0&request=GetFeatureInfo&layers=krax_sr_bref&query_layers=krax_sr_bref&styles=radar_reflectivity&crs=CRS%3A84&bbox=-78.4906%2C35.777%2C-78.4706%2C35.797&width=3&height=3&i=1&j=1&info_format=application%2Fjson&time=$TIME"
            echo "=== SR_BREF $TIME ==="
            curl -fsSL --max-time 30 "$URL" || true
            echo
            HURL="https://opengeo.ncep.noaa.gov/geoserver/krax/krax_bdhc/ows?service=WMS&version=1.3.0&request=GetFeatureInfo&layers=krax_bdhc&query_layers=krax_bdhc&styles=radar_bdhc&crs=CRS%3A84&bbox=-78.4906%2C35.777%2C-78.4706%2C35.797&width=3&height=3&i=1&j=1&info_format=application%2Fjson&time=$TIME"
            echo "=== BDHC $TIME ==="
            curl -fsSL --max-time 30 "$HURL" || true
            echo
          done
          echo "=== CONUS WMS CAP ==="
          curl -fsSL --max-time 30 'https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows?service=WMS&version=1.3.0&request=GetCapabilities' | grep -o '<Dimension name="time"[^>]*>[^<]*' | tail -1 || true
