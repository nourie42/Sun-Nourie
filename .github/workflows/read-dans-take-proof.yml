name: Read dated Dan take live diagnostic
on:
  push:
    branches: [verification/dans-take-diagnostic]
    paths: ['.github/workflows/read-dans-take-proof.yml']
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public runtime diagnostics, not secrets
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs/promises';
          const base='https://sun-nourie-live.onrender.com/api/weather-fusion';
          const rows=[];
          for(const query of ['location=knightdale','latitude=34.6385&longitude=-78.5025','latitude=30.3322&longitude=-81.6557','latitude=39.7392&longitude=-104.9903']){
            const f=await (await fetch(base+'/forecast?'+query,{signal:AbortSignal.timeout(60000)})).json();
            const b=await (await fetch(base+'/briefing?'+query,{signal:AbortSignal.timeout(80000)})).json();
            rows.push({query,location:f.location,feeds:f.feeds,briefing:b});
            console.log(JSON.stringify(rows.at(-1)));
          }
          await fs.writeFile('docs/weather-dans-take-runtime-diagnostic.json',JSON.stringify({checkedAt:new Date().toISOString(),rows},null,2));
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/weather-dans-take-runtime-diagnostic.json
          git commit -m 'Record actual briefing diagnostics and source status'
          git push origin HEAD:verification/dans-take-diagnostic
