name: Validate AI UX rebuild
on:
  push:
    paths:
      - '.github/workflows/validate-ai-ux-rebuild.yml'
permissions:
  contents: write
jobs:
  validate-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final navigation fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text().replace('req.pipe(proxyToLegacy);','req.pipe(proxyRequest);')
          p.write_text(s)
          w=Path('public/weather-fusion/index.html')
          t=w.read_text().replace('href="/ai-council/bots/" aria-label="Open AI Bots"><span aria-hidden="true">🤖</span> AI Bots','href="/ai-council/" aria-label="Open AI Chat"><span aria-hidden="true">🤖</span> AI Chat')
          w.write_text(t)
          b=Path('public/ai-council/bots-v2.js')
          u=b.read_text()
          old="renderBots(); renderHistory(); loadStatus();\n  const edit = new URLSearchParams(location.search).get('edit'); if (edit) setTimeout(() => openEditor(edit), 250);"
          new="renderBots(); renderHistory(); loadStatus();\n  const params = new URLSearchParams(location.search);\n  const requestedView = params.get('view'); if (['bots','hot','council','history'].includes(requestedView)) setView(requestedView);\n  const edit = params.get('edit'); if (edit) setTimeout(() => openEditor(edit), 250);"
          if old in u: u=u.replace(old,new)
          b.write_text(u)
      - name: Check syntax
        run: |
          node --check server.js
          node --check src/aiAgent.js
          node --check src/aiCouncil.js
          node --check public/ai-council/main-chat-v2.js
          node --check public/ai-council/bots-v2.js
          node --check public/ai-council/bot-chat-v2.js
          node --check public/ai-council/family-v2.js
      - name: Check required UX routes and labels
        run: |
          grep -q 'href="/ai-council/" aria-label="Open AI Chat"' public/weather-fusion/index.html
          grep -q 'Pick the best for me' public/ai-council/index.html
          grep -q 'Back to Chat' public/ai-council/bots-v2.html
          grep -q 'Internet Search' public/ai-council/bots-v2.html
          grep -q '/api/ai-agent/chat' public/ai-council/main-chat-v2.js
          grep -q '/api/ai-agent/chat' public/ai-council/bot-chat-v2.js
          grep -q '/api/ai-agent/chat' public/ai-council/family-v2.js
          ! grep -qi 'perplexity' src/aiAgent.js public/ai-council/index.html public/ai-council/main-chat-v2.js public/ai-council/bots-v2.html public/ai-council/bots-v2.js public/ai-council/bot-chat-v2.html public/ai-council/bot-chat-v2.js public/ai-council/family-v2.html public/ai-council/family-v2.js
      - name: Commit final fixes
        run: |
          git config user.name "nourie42"
          git config user.email "nourie42@gmail.com"
          git add server.js public/weather-fusion/index.html public/ai-council/bots-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish AI chat UX wiring"
          git push
