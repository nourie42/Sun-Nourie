name: Deal Desk regression checks
on:
  push:
    branches: [main]
    paths: ['deal-desk/**', 'src/dealDesk*', 'test/dealDesk*', '.github/workflows/deal-desk.yml']
  pull_request:
    paths: ['deal-desk/**', 'src/dealDesk*', 'test/dealDesk*', '.github/workflows/deal-desk.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deal-desk/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix deal-desk --no-audit --no-fund
      - run: npm run build --prefix deal-desk
      - run: node --test test/dealDesk*.test.js
