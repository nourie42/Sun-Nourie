name: Weather Nourie repair review
on:
  push:
    branches: [weather-nourie-morning-map-fix]
    paths: ['.github/workflows/weather-nourie-repair-review.yml', 'scripts/weatherNourieRepair.*']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Collect weather-only review copy and live API evidence
        run: |
          mkdir -p /tmp/weather-nourie-review
          python - <<'PY'
          import pathlib, zipfile, urllib.request
          root=pathlib.Path('.')
          with zipfile.ZipFile('/tmp/weather-nourie-review/source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for pattern in ['public/weather-fusion/**/*','src/weather*.js','test/weather*','scripts/weather*','docs/weather*','.github/workflows/weather*','package*.json','node_modules/**/*']:
              for p in root.glob(pattern):
                if p.is_file():z.write(p,str(p))
          for loc in ['knightdale','greenville']:
            url='https://sun-nourie-live.onrender.com/api/weather-fusion/forecast?location='+loc
            try:
              with urllib.request.urlopen(url,timeout=65) as r:
                pathlib.Path('/tmp/weather-nourie-review/'+loc+'.json').write_bytes(r.read(3000000))
            except Exception as e:print(loc,str(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weather-nourie-repair-source
          path: /tmp/weather-nourie-review
          retention-days: 1
