name: Weather Nourie repair review
on:
  push:
    branches: [weather-nourie-morning-map-fix]
    paths: ['scripts/weatherNourieRepair*', '.github/workflows/weather-nourie-repair-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integrity-checked weather-only edits
        run: |
          python - <<'PY'
          import pathlib,json,base64,lzma,hashlib
          parts=['scripts/weatherNourieRepair.1.b64','scripts/weatherNourieRepair.2.b64','scripts/weatherNourieRepair.b64']
          raw=lzma.decompress(base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts)))
          assert hashlib.sha256(raw).hexdigest()=='d2596daa7caf78746eb502c740cb4234a2f3b1bc6b2784fb935c6c478b99742c'
          edits=json.loads(raw)
          for e in edits:
            name=e['path'];assert '..' not in name and name.startswith(('src/weatherFusion','public/weather-fusion/','scripts/weather','test/weatherFusion','docs/weather-nourie'))
            p=pathlib.Path(name);old=p.read_text() if p.exists() else ''
            assert hashlib.sha256(old.encode()).hexdigest()==e['old'],name+' changed since review'
            lines=old.splitlines(keepends=True)
            for a,b,insert in reversed(e['changes']):lines[a:b]=insert
            new=''.join(lines);assert hashlib.sha256(new.encode()).hexdigest()==e['new'],name+' output mismatch'
            p.parent.mkdir(exist_ok=True,parents=True);p.write_text(new)
          pathlib.Path('/tmp/weather-repair-paths.json').write_text(json.dumps([e['path'] for e in edits]))
          pathlib.Path('/tmp/weather-repair-results').mkdir(parents=True,exist_ok=True)
          PY
      - run: npm ci
      - name: Weather unit tests, original site checks and native model syntax
        run: |
          node --test test/weatherFusion*.test.js
          npm run check
          python -m py_compile scripts/weather_fusion_collect.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import weather_fusion_collect as c
          assert c.NOAA_FIELDS['hrrr'][('UGRD','10 m above ground')]=='u'
          assert c.NOAA_FIELDS['hrrr'][('VGRD','10 m above ground')]=='v'
          PY
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser stress test
        run: node scripts/weatherNourieRepairSmoke.js
      - name: Publish verified weather-only tree on staging branch
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = c06a8a35a3078986a7cd5bbf3705c73c0e4a4744
          export PUBLISH="$RUNNER_TEMP/weather-nourie-repair"
          git worktree add --detach "$PUBLISH" FETCH_HEAD
          python - <<'PY'
          import pathlib,json,os,shutil,subprocess
          root=pathlib.Path(os.environ['PUBLISH'])
          paths=json.loads(pathlib.Path('/tmp/weather-repair-paths.json').read_text())
          for name in paths:
            target=root/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,target)
          subprocess.run(['git','-C',str(root),'add','--',*paths],check=True)
          PY
          cd "$PUBLISH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'Fix Weather Nourie same-day weights, morning comfort, dewpoint chart and orphaned map frames'
          git push origin HEAD:refs/heads/weather-nourie-repair-verified --force
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-nourie-repair-browser
          path: /tmp/weather-repair-results
          retention-days: 3
