name: AI Chat Live Smoke

on:
  push:
    branches:
      - main
    paths:
      - "public/ai-council/**"
      - "src/aiAgent.js"
      - "src/aiCouncil.js"
      - ".github/workflows/ai-chat-live-smoke.yml"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Render and verify live AI Chat
        env:
          LIVE_URL: https://sun-nourie-live.onrender.com
        run: |
          set -u
          for attempt in $(seq 1 48); do
            echo "Live AI Chat check $attempt/48"
            home="$(curl -fsSL --max-time 20 "$LIVE_URL/ai-council/?smoke=$GITHUB_SHA" 2>/dev/null || true)"
            bots="$(curl -fsSL --max-time 20 "$LIVE_URL/ai-council/bots/?smoke=$GITHUB_SHA" 2>/dev/null || true)"
            status="$(curl -fsSL --max-time 20 "$LIVE_URL/api/ai-agent/status?smoke=$GITHUB_SHA" 2>/dev/null || true)"

            if printf '%s' "$home" | grep -Fq 'Pick the best AI for me' \
              && printf '%s' "$home" | grep -Fq 'Pick the AI model myself' \
              && printf '%s' "$home" | grep -Fq 'id="newChatBtn"' \
              && printf '%s' "$home" | grep -Fq '⚙ Settings' \
              && printf '%s' "$home" | grep -Fq '/ai-council/main-chat-v2.js?v=5' \
              && printf '%s' "$bots" | grep -Fq '<a href="/ai-council/?view=council">☷<br>Council</a>' \
              && ! printf '%s' "$bots" | grep -Fq 'Under Construction' \
              && printf '%s' "$status" | grep -Fq '"autoChecked":true' \
              && ! printf '%s' "$status" | grep -Fq '"healthStatus":"unchecked"'; then
              echo "Live AI Chat is automatically checking every configured provider and none are left unchecked."
              exit 0
            fi

            sleep 10
          done

          echo "Render did not serve the expected AI Chat version within the retry window."
          echo "Home markers:"
          printf '%s' "$home" | grep -Eo 'Pick the best AI for me|Pick the AI model myself|newChatBtn|Settings' | sort -u || true
          echo "Bots Council marker:"
          printf '%s' "$bots" | grep -F '<a href="/ai-council/?view=council">☷<br>Council</a>' || true
          echo "Provider health markers:"
          printf '%s' "$status" | grep -Eo '"autoChecked":(true|false)|"healthStatus":"[^"]+"' || true
          exit 1
