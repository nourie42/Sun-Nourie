name: Assemble Weather Nourie upgrade
on:
  push:
    branches: [weather-nourie-friendly-graphs]
    paths: ['scripts/weatherNourieUpgrade.b64']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed weather-only edits with old and new content hashes
        run: |
          python - <<'PY'
          import base64, lzma, json, hashlib
          from pathlib import Path
          parts=['scripts/weatherNourieUpgrade.1.b64','scripts/weatherNourieUpgrade.2.b64','scripts/weatherNourieUpgrade.3.b64','scripts/weatherNourieUpgrade.b64']
          raw=lzma.decompress(base64.b64decode(''.join(Path(p).read_text().strip() for p in parts)))
          assert hashlib.sha256(raw).hexdigest()=='8651571ba23e84981a0aa7c70525d17060a370ed7e248c541c1f0544a72a46af'
          edits=json.loads(raw)
          for edit in edits:
            name=edit['path']
            assert '..' not in name and name.startswith(('public/weather-fusion/','src/weatherFusion','test/weatherFusion','scripts/weatherFusion','scripts/weatherNourie','docs/weather-nourie','.github/workflows/weather-fusion'))
            path=Path(name)
            old=path.read_text() if path.exists() else ''
            assert (hashlib.sha256(old.encode()).hexdigest() if old else None)==edit['old'],name+' changed since review'
            new=old
            for start,end,insert in reversed(edit['changes']):new=new[:start]+insert+new[end:]
            assert hashlib.sha256(new.encode()).hexdigest()==edit['new'],name+' output mismatch'
            path.parent.mkdir(parents=True,exist_ok=True);path.write_text(new)
          # UI-only solar estimates must not repeatedly invalidate the AI weather briefing.
          p=Path('src/weatherFusion.js');s=p.read_text()
          assert 'comfort:output.comfort, ' in s
          p.write_text(s.replace('comfort:output.comfort, ',''))
          # Expand the existing native model collector for real pressure/visibility graphs.
          p=Path('scripts/weather_fusion_collect.py');s=p.read_text()
          def change(old,new):
            global s
            assert old in s, 'Collector source changed: '+old[:80]
            s=s.replace(old,new)
          change('("GUST", "surface"): "gust"','("GUST", "surface"): "gust", ("VIS", "surface"): "visibility"')
          change('"tcc": "clouds"}', '"tcc": "clouds", "msl": "pressure_msl"}')
          change('"nearbyReflectivity": "nearby_reflectivity"}', '"nearbyReflectivity": "nearby_reflectivity", "visibility": "visibility", "pressure_msl": "pressure_msl"}')
          change('"nearby_reflectivity": "dBZ"}', '"nearby_reflectivity": "dBZ", "visibility": "mi", "pressure_msl": "inHg"}')
          change('and old.get("complete"):', 'and old.get("complete") and old.get("cardFieldsVersion") == 1:')
          change('        elif field == "precipitation":', '\n'.join([
            '        elif field == "visibility":',
            '            if units != "m": raise ValueError(f"Unexpected visibility units: {units}")',
            '            data /= 1609.344',
            '            data[(data < 0) | (data > 200)] = np.nan',
            '        elif field == "pressure_msl":',
            '            if units != "Pa": raise ValueError(f"Unexpected pressure units: {units}")',
            '            data /= 3386.389',
            '            data[(data < 20) | (data > 35)] = np.nan',
            '        elif field == "precipitation":']))
          change('"points":list(points.values())','"cardFieldsVersion":1,"points":list(points.values())')
          p.write_text(s)
          PY
      - run: python -m py_compile scripts/weather_fusion_collect.py
      - run: npm ci
      - run: node --test test/weatherFusion*.test.js
      - run: npm run check
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile dialogs, time boundary, graph gaps and location switching
        run: node scripts/weatherNourieBrowserSmoke.js
      - name: Commit verified weather-only tree on a staging branch
        run: |
          git rm -- .github/workflows/weather-nourie-build.yml scripts/weatherNourieUpgrade*.b64
          git add -- public/weather-fusion src/weatherFusion*.js test/weatherFusion*.js scripts/weatherFusionBrowserSmoke.js scripts/weatherNourie*.js scripts/weather_fusion_collect.py docs/weather-nourie-experience.md .github/workflows/weather-fusion-data.yml .github/workflows/weather-fusion-live.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Weather Nourie branding, plain-language outlook and interactive forecast graphs'
          git push origin HEAD:weather-nourie-ui-verified
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-nourie-ui-verification
          path: /tmp/weather-review
          retention-days: 3
