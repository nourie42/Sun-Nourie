name: Import approved weather photographs
on:
  push:
    branches: [weather-photo-outfits-20261018]
    paths: ['.github/workflows/weather-photo-import-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weather-photo-outfits-20261018
      - name: Import only the approved image archive
        env:
          ARCHIVE_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-66a8-820c-8375-f9a7b7fcd88c/raw?se=2026-10-18T17%3A43%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=8e95c4f5-e29a-5f84-b4f0-1d4177d3da8e&skoid=434ec24f-a0f0-4e64-b0de-2e2053f69735&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-18T15%3A21%3A00Z&ske=2026-10-19T15%3A21%3A00Z&sks=b&skv=2026-02-06&sig=l/lCA5LJTqj9yqqRRGV9cAkaso3Q37c6NgAd8paafGA%3D'
        run: |
          python - <<'PY'
          import os, urllib.request, hashlib, io, zipfile, re, pathlib, json
          request=urllib.request.Request(os.environ['ARCHIVE_URL'])
          with urllib.request.urlopen(request, timeout=90) as response:
              data=response.read(40*1024*1024+1)
          assert len(data)<=40*1024*1024, 'Oversized archive'
          assert hashlib.sha256(data).hexdigest()=='f4c4a4d9ea24b9eb583e212477c0eacb5e62283c989baae32a0e14ef20966409', 'Archive checksum mismatch'
          root=pathlib.Path('public/weather-fusion')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              entries=archive.infolist()
              assert len(entries)==90 and len({e.filename for e in entries})==90, 'Expected exactly 90 distinct approved images'
              manifest=[]
              for entry in entries:
                  assert re.fullmatch(r'[a-z0-9-]+\.webp',entry.filename), 'Unexpected archive entry'
                  assert 0<entry.file_size<1500000, 'Unexpected image size'
                  pixels=archive.read(entry)
                  assert pixels[:4]==b'RIFF' and pixels[8:12]==b'WEBP', 'Invalid WebP image'
                  name='pwy-'+entry.filename
                  (root/name).write_bytes(pixels)
                  manifest.append({'file':name,'bytes':len(pixels),'sha256':hashlib.sha256(pixels).hexdigest()})
          (root/'pwy-assets.json').write_text(json.dumps({'version':'pwy-photo-v1','count':90,'images':manifest},indent=2)+'\n')
          print('Imported and verified all 90 approved photographs.')
          PY
      - name: Commit assets and remove this one-time importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/weather-fusion/pwy-*.webp public/weather-fusion/pwy-assets.json
          git rm -- .github/workflows/weather-photo-import-once.yml
          git commit -m 'Add all 90 approved weather and feels-like outfit photographs'
          git push origin HEAD:weather-photo-outfits-20261018
