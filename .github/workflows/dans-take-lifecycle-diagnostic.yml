name: Diagnose Dan take request lifecycle
on:
  push:
    branches: [fix/dans-take-request-lifecycle]
    paths: ['.github/workflows/dans-take-lifecycle-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci >/tmp/dans-npm.log 2>&1
      - name: Capture live source and response without altering weather or settings
        run: |
          mkdir -p /tmp/dans-diagnostic
          git archive HEAD >/tmp/dans-diagnostic/source.tar
          tar -czf /tmp/dans-diagnostic/dependencies.tgz node_modules
          node --input-type=module - <<'JS'
          import fs from 'node:fs/promises';
          import {collectDanTakeEvidence,visibleDanTakeItems} from './public/weather-fusion/dans-take.js';
          const base='https://sun-nourie-live.onrender.com/api/weather-fusion/';
          const rows=[];
          for(const location of ['knightdale','greenville']){
            const f=await (await fetch(base+'forecast?location='+location,{signal:AbortSignal.timeout(60000)})).json();
            const response=await fetch(base+'briefing?location='+location+'&signature='+f.signature,{signal:AbortSignal.timeout(90000)});
            const b=await response.json();
            const e=collectDanTakeEvidence(f);
            rows.push({location,forecast:f,briefing:b,status:response.status,evidence:e,visible:visibleDanTakeItems(b,f)});
            console.log('MISSING_CARD_DIAGNOSIS',JSON.stringify({location,status:response.status,signature:f.signature,discussion:f.discussion?.id,issued:f.discussion?.issuanceTime,office:f.location.office,source:e.source,candidates:e.candidates,briefing:b,visible:visibleDanTakeItems(b,f)}));
          }
          await fs.writeFile('/tmp/dans-diagnostic/report.json',JSON.stringify({checkedAt:new Date().toISOString(),rows},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dans-take-lifecycle-diagnostic
          path: /tmp/dans-diagnostic
          retention-days: 7
