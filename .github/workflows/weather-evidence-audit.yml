name: Weather evidence and independent thermal audit
on:
  push:
    branches: [fix/weather-evidence-and-thermal-audit]
    paths: ['.github/workflows/weather-evidence-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pythermalcomfort==4.4.2
      - name: Retrieve actual inputs, discussion and briefing without modifying forecasts
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs/promises';
          import {utciF} from './public/weather-fusion/utci.js';
          const report={checkedAt:new Date().toISOString(),locations:[],referenceCases:[]};
          for(const location of ['knightdale','greenville']){
            const base='https://sun-nourie-live.onrender.com/api/weather-fusion/';
            const f=await (await fetch(base+'forecast?location='+location,{signal:AbortSignal.timeout(75000)})).json();
            let b;try{b=await (await fetch(base+'briefing?location='+location,{signal:AbortSignal.timeout(90000)})).json();}catch(e){b={error:e.message};}
            report.locations.push({location,assembledAt:f.assembledAt,current:f.current,comfort:f.comfort,discussion:f.discussion,briefing:b,feeds:f.feeds,hours:f.hours?.slice(0,5),points:f.metricForecasts?.series?.feels?.slice(0,5)});
          }
          for(const t of [0,32,46,66,75,79,88,95,110])for(const rh of [20,50,90])for(const wind of [0,2,10,25]){
            report.referenceCases.push({t,rh,wind,tr:t,actual:utciF(t,t,wind,rh)});
          }
          await fs.writeFile('/tmp/weather-audit.json',JSON.stringify(report));
          JS
      - name: Independent reference calculation (not the app calculating its own expected results)
        run: |
          python - <<'PY'
          import json
          from pythermalcomfort.models import utci
          report=json.load(open('/tmp/weather-audit.json'))
          for c in report['referenceCases']:
              t=(c['t']-32)/1.8
              v=max(.51,min(16.99,c['wind']*.44704))
              reference=float(utci(tdb=t,tr=t,v=v,rh=c['rh'],round_output=False).utci)*1.8+32
              c['independentReferenceF']=reference
              c['errorF']=c['actual']-reference
          for row in report['locations']:
              c=row['current']; t=(c['temperature']-32)/1.8
              rh=row['comfort']['humidity'];v=max(.51,min(16.99,c['wind']*.44704))
              row['independentNightReferenceF']=float(utci(tdb=t,tr=t,v=v,rh=rh,round_output=False).utci)*1.8+32
          report['maxAbsoluteReferenceErrorF']=max(abs(c['errorF']) for c in report['referenceCases'])
          json.dump(report,open('docs/weather-evidence-audit.json','w'),indent=2)
          print('Independent maximum error:',report['maxAbsoluteReferenceErrorF'])
          PY
      - name: Record audit evidence on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/weather-evidence-audit.json
          git commit -m 'Record actual inputs and independent UTCI audit'
          git push origin HEAD:fix/weather-evidence-and-thermal-audit
