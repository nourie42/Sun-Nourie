name: Verify Weather Nourie nationwide HRRR and uncertainty
on:
  push:
    branches: [fix/weather-nationwide-uncertainty]
    paths:
      - 'scripts/patch_weather_nationwide_uncertainty.py'
      - '.github/workflows/weather-nationwide-uncertainty.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed weather patch
        run: python scripts/patch_weather_nationwide_uncertainty.py
      - name: Syntax checks
        run: |
          node --check src/weatherFusion.js
          node --check src/weatherFusionExperience.js
          node --check src/weatherFusionDirect.js
          node --check src/weatherFusionHrrrMap.js
          node --check public/weather-fusion/app.js
          node --check test/weatherFusionUserFeedback.test.js
      - run: npm ci
      - name: All Weather Nourie regression tests
        run: node --test test/weatherFusion*.test.js
      - name: Existing website regression checks
        run: npm run check
      - name: Commit only the verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch_weather_nationwide_uncertainty.py .github/workflows/weather-nationwide-uncertainty.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python - <<'PY'
          import subprocess
          expected=set('''
          src/weatherFusion.js
          src/weatherFusionExperience.js
          src/weatherFusionDirect.js
          src/weatherFusionHrrrMap.js
          public/weather-fusion/app.js
          public/weather-fusion/index.html
          public/weather-fusion/personal-details.css
          test/weatherFusionForecastDetails.test.js
          test/weatherFusionUserFeedback.test.js
          docs/weather-fusion.md
          scripts/patch_weather_nationwide_uncertainty.py
          .github/workflows/weather-nationwide-uncertainty.yml
          '''.split())
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','d057f0d216ea1a10f778e7921f3df4a21ddf3307'],text=True).split())
          if actual != expected:
              print('Unexpected verified file set. Missing:',sorted(expected-actual),'Extra:',sorted(actual-expected))
              raise SystemExit(1)
          print('Verified file set:',len(actual),'paths')
          PY
          git commit -m 'Make Dan take local and use nationwide HRRR maps'
          git push origin HEAD:fix/weather-nationwide-uncertainty
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
