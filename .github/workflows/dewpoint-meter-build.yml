name: Assemble Dew Point Gross Meter
on:
  push:
    branches: [weather-nourie-dewpoint-meter]
    paths:
      - '.github/workflows/dewpoint-meter-build.yml'
      - 'scripts/patchDewpointMeter.py'
      - 'public/weather-fusion/dewpoint-meter.*'
      - 'test/weatherFusionDewpointMeter.test.js'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/patchDewpointMeter.py
      - run: node --check public/weather-fusion/experience.js
      - run: node --check public/weather-fusion/dewpoint-meter.js
      - run: npm ci
      - run: node --test test/weatherFusion*.test.js
      - run: npm run check
      - name: Commit only the verified feature
        run: |
          git rm .github/workflows/dewpoint-meter-build.yml scripts/patchDewpointMeter.py
          git add public/weather-fusion/experience.js public/weather-fusion/dewpoint-meter.js public/weather-fusion/dewpoint-meter.css test/weatherFusionDewpointMeter.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Dew Point Gross Meter and overnight comfort guidance'
          git push origin HEAD:weather-nourie-dewpoint-verified --force
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
