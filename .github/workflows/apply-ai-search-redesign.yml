 solid #292930;border-bottom-left-radius:7px}.sources{margin-top:9px;padding-top:8px;border-top:1px solid #2c2c32}.sources a{display:block;color:#7dbbff;font-size:10px;text-decoration:none;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.composer{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(790px,calc(100% - 16px));background:rgba(21,21,24,.97);backdrop-filter:blur(18px);border:1px solid #303037;border-radius:22px;padding:9px;z-index:20}.compose{display:grid;grid-template-columns:1fr auto;gap:8px}.compose textarea{border:0;outline:0;background:transparent;color:#fff;min-height:50px;max-height:150px;resize:none;padding:12px;font:inherit}.send{width:50px;height:50px;border:0;border-radius:16px;background:#f3f3f5;color:#111;font-size:20px;font-weight:950}.composeBottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:4px 6px 1px}.code{width:100%;border:1px solid #2c2c32;background:#101013;color:#ddd;border-radius:10px;padding:8px 9px;font-size:11px}.status{font-size:10px;color:#74747d}.councilBox{border:1px solid #2d2d34;background:#151518;border-radius:20px;padding:17px}.councilBox textarea{width:100%;min-height:105px;background:#101013;color:#fff;border:1px solid #303036;border-radius:14px;padding:12px;resize:vertical}.checks{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.checks label{border:1px solid #303036;border-radius:999px;padding:8px 10px;font-size:11px;color:#aaa}.councilAnswers{display:grid;gap:10px;margin-top:16px}.answer{border:1px solid #2a2a30;border-radius:16px;padding:14px;background:#161619}.answer h3{margin:0 0 7px;font-size:14px}.answer pre{margin:0;white-space:pre-wrap;font:inherit;line-height:1.5;color:#d7d7dc}.error{color:#ff8da1;font-size:11px;margin-top:8px}@media(max-width:620px){.providers{grid-template-columns:1fr 1fr}.shell{padding-left:12px;padding-right:12px}.msg{max-width:94%}}
</style>
</head>
<body><div class="app"><main class="shell"><header class="top"><div><div class="brand">AI Search</div><div class="sub" id="status">Checking AI providers…</div></div></header><nav class="nav"><button id="searchTab" class="active">AI Search</button><button id="councilTab">AI Council</button><a href="/ai-council/bots/">Bots & Hot Room</a></nav><section id="searchView" class="view active"><div class="hero"><h1>Ask one AI.</h1><p>Pick the model you want, ask your question, and keep the conversation focused on that AI.</p></div><div class="providers" id="providers"></div><div class="messages" id="messages"></div></section><section id="councilView" class="view"><div class="hero"><h1>AI Council</h1><p>Ask the same question to multiple AIs and compare their answers.</p></div><div class="councilBox"><textarea id="councilQuestion" placeholder="Ask the Council…"></textarea><div class="checks" id="councilChecks"></div><button class="send" id="runCouncil" style="width:auto;padding:0 18px">Ask</button><div class="error" id="councilError"></div><div class="councilAnswers" id="councilAnswers"></div></div></section></main><div class="composer" id="composer"><div class="compose"><textarea id="prompt" placeholder="Ask anything…"></textarea><button class="send" id="send">↑</button></div><div class="composeBottom"><input class="code" id="accessCode" type="password" placeholder="Owner access code"><span class="status" id="modelLabel"></span></div></div></div><script>
const IDS=['openai','anthropic','gemini','xai'];const NAMES={openai:'OpenAI',anthropic:'Claude',gemini:'Gemini',xai:'Grok'};const KEY='ai-search-history-v1';let providers=[],selected='openai',history=load(),sending=false;const $=id=>document.getElementById(id);try{$('accessCode').value=sessionStorage.getItem('ai-council-access')||''}catch{}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'?x:{}}catch{return{}}}function save(){localStorage.setItem(KEY,JSON.stringify(history))}function selectedProvider(){return providers.find(p=>p.id===selected)}function renderProviders(){$('providers').replaceChildren();for(const id of IDS){const p=providers.find(x=>x.id===id);const b=document.createElement('button');b.className=`provider${selected===id?' active':''}${!p?.configured?' off':''}`;b.disabled=!p?.configured;b.innerHTML=`<strong>${NAMES[id]}</strong><small>${p?.configured?p.model:'Not connected'}</small>`;b.onclick=()=>{selected=id;renderProviders();renderMessages();updateModelLabel()};$('providers').append(b)}if(!selectedProvider()?.configured){const first=providers.find(p=>p.configured&&IDS.includes(p.id));if(first){selected=first.id;renderProviders()}}}
function updateModelLabel(){const p=selectedProvider();$('modelLabel').textContent=p?.configured?`${p.label} · ${p.model}`:'Not connected'}function renderMessages(){$('messages').replaceChildren();for(const m of (history[selected]||[])){const d=document.createElement('div');d.className=`msg ${m.role==='user'?'user':'ai'}`;d.textContent=m.text;if(m.role!=='user'&&Array.isArray(m.citations)&&m.citations.length){const s=document.createElement('div');s.className='sources';m.citations.forEach((u,i)=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.textContent=`Source ${i+1}: ${u}`;s.append(a)});d.append(s)}$('messages').append(d)}requestAnimationFrame(()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
async function send(){if(sending)return;const text=$('prompt').value.trim(),code=$('accessCode').value.trim(),p=selectedProvider();if(!text||!code||!p?.configured)return;try{sessionStorage.setItem('ai-council-access',code)}catch{}history[selected]??=[];history[selected].push({role:'user',text,at:Date.now()});$('prompt').value='';save();renderMessages();sending=true;$('send').disabled=true;try{const transcript=(history[selected]||[]).slice(-12).map(m=>`${m.role==='user'?'User':NAMES[selected]}: ${m.text}`).join('\n\n');const q=`You are ${NAMES[selected]}. Continue this conversation naturally.\n\n${transcript}`;const r=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':code},body:JSON.stringify({question:q,providers:[selected]})});const d=await r.json().catch(()=>({}));const a=(d.answers||[]).find(x=>x.id===selected&&x.ok);if(!r.ok||!a)throw new Error((d.answers||[])[0]?.error||d.error||'AI request failed.');history[selected].push({role:'ai',text:a.text,at:Date.now(),citations:a.citations||[]});save();renderMessages()}catch(e){history[selected].push({role:'ai',text:`Error: ${e.message}`,at:Date.now()});save();renderMessages()}finally{sending=false;$('send').disabled=false}}
function renderCouncilChecks(){$('councilChecks').replaceChildren();for(const id of IDS){const p=providers.find(x=>x.id===id);const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.value=id;c.checked=!!p?.configured;c.disabled=!p?.configured;l.append(c,document.createTextNode(` ${NAMES[id]}`));$('councilChecks').append(l)}}async function runCouncil(){const q=$('councilQuestion').value.trim(),code=$('accessCode').value.trim(),ids=[...$('councilChecks').querySelectorAll('input:checked')].map(x=>x.value);$('councilError').textContent='';$('councilAnswers').replaceChildren();if(!q||!code||!ids.length)return;const r=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':code},body:JSON.stringify({question:q,providers:ids})});const d=await r.json().catch(()=>({}));if(!r.ok){$('councilError').textContent=d.error||'Council request failed.';return}for(const a of d.answers||[]){const box=document.createElement('div');box.className='answer';const h=document.createElement('h3');h.textContent=`${a.label} · ${a.model}`;const pre=document.createElement('pre');pre.textContent=a.ok?a.text:a.error;box.append(h,pre);$('councilAnswers').append(box)}if(d.verdict?.text){const box=document.createElement('div');box.className='answer';const h=document.createElement('h3');h.textContent='Council Verdict';const pre=document.createElement('pre');pre.textContent=d.verdict.text;box.append(h,pre);$('councilAnswers').append(box)}}
function mode(name){const council=name==='council';$('searchView').classList.toggle('active',!council);$('councilView').classList.toggle('active',council);$('searchTab').classList.toggle('active',!council);$('councilTab').classList.toggle('active',council);$('composer').style.display=council?'none':'block';if(council)history.replaceState(null,'','/ai-council/?mode=council');else history.replaceState(null,'','/ai-council/')}$('searchTab').onclick=()=>mode('search');$('councilTab').onclick=()=>mode('council');$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('runCouncil').onclick=runCouncil;
fetch('/api/ai-council/status',{cache:'no-store'}).then(r=>r.json()).then(d=>{providers=(d.providers||[]).filter(p=>IDS.includes(p.id));$('status').textContent=`${providers.filter(p=>p.configured).length} of 4 AIs connected`;renderProviders();renderMessages();renderCouncilChecks();updateModelLabel();if(new URLSearchParams(location.search).get('mode')==='council')mode('council')}).catch(()=>{$('status').textContent='Provider status unavailable'});
</script></body></html>''')

          # Main Bot Studio: drop legacy Perplexity references and migrate old saved Perplexity bots to OpenAI.
          b = Path('public/ai-council/bots.html')
          t = b.read_text()
          t = t.replace("const providerMeta={openai:'OpenAI',anthropic:'Claude',gemini:'Gemini',xai:'Grok',perplexity:'Perplexity'};", "const providerMeta={openai:'OpenAI',anthropic:'Claude',gemini:'Gemini',xai:'Grok'};")
          anchor = "function saveBots(){localStorage.setItem(STORAGE_KEY,JSON.stringify(bots))}"
          if anchor in t and 'migrateRemovedProviders' not in t:
              t = t.replace(anchor, anchor + "\n    function migrateRemovedProviders(){let changed=false;bots=bots.map(b=>{if(b.provider==='perplexity'){changed=true;return{...b,provider:'openai',tools:{...(b.tools||{}),webSearch:false}}}return b});if(changed)saveBots()}\n    migrateRemovedProviders();", 1)
          b.write_text(t)

          # Family pages: default to Search after unlock; Bots is secondary; Council opens the main Council.
          Path('public/ai-council/family.js').write_text(r'''const root=document.documentElement;const member=root.dataset.member||'Family';const slug=member.toLowerCase();const STORAGE=`ai-family-vault-${slug}-v1`;const COLORS=['#1687ff','#ff2146','#00c877','#8b46ff','#ff6d00','#9a6238','#f2ca36','#ff72b6'];const IDS=['openai','anthropic','gemini','xai'];const NAMES={openai:'OpenAI',anthropic:'Claude',gemini:'Gemini',xai:'Grok'};const te=new TextEncoder(),td=new TextDecoder();let providers=[],vault=null,secret='',activeBot=null,selectedColor=COLORS[0],editingId=null,selectedAI='openai';
const $=id=>document.getElementById(id);const els={lock:$('lock'),setup:$('setup'),unlock:$('unlock'),workspace:$('workspace'),setupSecret:$('setup-secret'),setupConfirm:$('setup-confirm'),ownerCode:$('owner-code'),unlockSecret:$('unlock-secret'),lockError:$('lock-error'),bots:$('bots'),messages:$('messages'),composer:$('composer'),prompt:$('prompt'),send:$('send'),chatTitle:$('chat-title'),chatRole:$('chat-role'),chatView:$('chat-view'),botsView:$('bots-view'),sheet:$('sheet'),sheetBack:$('sheet-back'),botName:$('bot-name'),botRole:$('bot-role'),botProvider:$('bot-provider'),botInstructions:$('bot-instructions'),palette:$('palette'),sheetTitle:$('sheet-title'),deleteBot:$('delete-bot'),providerStatus:$('provider-status')};
function b64(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes)))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function rand(n=16){return crypto.getRandomValues(new Uint8Array(n))}async function derive(pass,salt){const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function seal(obj,pass,salt=rand()){const iv=rand(12),key=await derive(pass,salt),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{salt:b64(salt),iv:b64(iv),cipher:b64(cipher)}}async function openVault(record,pass){const key=await derive(pass,unb64(record.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(record.iv)},key,unb64(record.cipher));return JSON.parse(td.decode(plain))}
function stored(){try{return JSON.parse(localStorage.getItem(STORAGE)||'null')}catch{return null}}async function save(){if(!vault||!secret)return;localStorage.setItem(STORAGE,JSON.stringify(await seal(vault,secret)))}function show(el,on=true){el?.classList.toggle('hidden',!on)}function err(t=''){els.lockError.textContent=t}function now(){return Date.now()}function fmt(t){if(!t)return'';const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d.toLocaleDateString([],{weekday:'short'})}function id(){return`bot-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`}function normalizeTools(t){return{gmail:!!t?.gmail,browser:!!t?.browser,shopping:!!t?.shopping}}
function ensureSearchUi(){if($('family-search-view'))return;const style=document.createElement('style');style.textContent=`.familyNav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.familyNav button,.familyNav a{border:1px solid #303036;background:#17171b;color:#aaa;border-radius:999px;padding:9px 11px;font-size:11px;font-weight:850;text-decoration:none}.familyNav .active{background:#f2f2f4;color:#111}.familySearch h1{font-size:clamp(32px,7vw,52px);letter-spacing:-.05em;margin:14px 0 6px}.familySearch p{color:#8e8e97;line-height:1.5}.familyProviders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}.familyProvider{border:1px solid #303036;background:#151518;color:#bbb;border-radius:15px;padding:12px 9px;text-align:left}.familyProvider strong{display:block;color:#fff}.familyProvider small{display:block;color:#73737b;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.familyProvider.active{border-color:#666674;background:#222228}.familyProvider.off{opacity:.4}.familySearchMessages{display:flex;flex-direction:column;gap:10px;padding:8px 0 130px}.familyMsg{max-width:90%;padding:12px 14px;border-radius:17px;white-space:pre-wrap;line-height:1.5;font-size:14px}.familyMsg.user{align-self:flex-end;background:#f2f2f4;color:#111}.familyMsg.ai{align-self:flex-start;background:#18181c;border:1px solid #292930}.familySearchComposer{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 16px));background:rgba(21,21,24,.97);border:1px solid #303037;border-radius:22px;padding:9px;z-index:30;display:grid;grid-template-columns:1fr auto;gap:8px}.familySearchComposer textarea{border:0;outline:0;background:transparent;color:#fff;resize:none;padding:11px;min-height:48px}.familySearchComposer button{width:48px;height:48px;border:0;border-radius:15px;background:#f2f2f4;color:#111;font-weight:950;font-size:20px}@media(max-width:620px){.familyProviders{grid-template-columns:1fr 1fr}}`;document.head.appendChild(style);const header=els.workspace.querySelector('.top');const nav=document.createElement('div');nav.className='familyNav';nav.innerHTML=`<button id="family-search-tab" class="active">AI Search</button><button id="family-bots-tab">My Bots</button><a href="/ai-council/?mode=council">AI Council</a>`;header.insertAdjacentElement('afterend',nav);const view=document.createElement('section');view.id='family-search-view';view.className='familySearch';view.innerHTML=`<h1>Ask one AI.</h1><p>Choose OpenAI, Claude, Gemini, or Grok and ask your question.</p><div class="familyProviders" id="family-providers"></div><div class="familySearchMessages" id="family-search-messages"></div>`;nav.insertAdjacentElement('afterend',view);const comp=document.createElement('div');comp.id='family-search-composer';comp.className='familySearchComposer';comp.innerHTML=`<textarea id="family-search-prompt" placeholder="Ask anything…"></textarea><button id="family-search-send">↑</button>`;document.body.append(comp);$('family-search-tab').onclick=showSearch;$('family-bots-tab').onclick=showBots;$('family-search-send').onclick=sendSearch;$('family-search-prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendSearch()}})}
function renderFamilyProviders(){const root=$('family-providers');if(!root)return;root.replaceChildren();for(const id of IDS){const p=providers.find(x=>x.id===id);const b=document.createElement('button');b.className=`familyProvider${selectedAI===id?' active':''}${!p?.configured?' off':''}`;b.disabled=!p?.configured;b.innerHTML=`<strong>${NAMES[id]}</strong><small>${p?.configured?p.model:'Not connected'}</small>`;b.onclick=()=>{selectedAI=id;renderFamilyProviders();renderSearchMessages()};root.append(b)}if(!providers.find(p=>p.id===selectedAI&&p.configured)){const first=providers.find(p=>IDS.includes(p.id)&&p.configured);if(first){selectedAI=first.id;renderFamilyProviders()}}}
function renderSearchMessages(){const root=$('family-search-messages');if(!root||!vault)return;root.replaceChildren();vault.searchHistory??={};for(const m of vault.searchHistory[selectedAI]||[]){const d=document.createElement('div');d.className=`familyMsg ${m.role==='user'?'user':'ai'}`;d.textContent=m.text;root.append(d)}}async function sendSearch(){const text=$('family-search-prompt')?.value.trim(),p=providers.find(x=>x.id===selectedAI&&x.configured);if(!text||!p||!vault)return;vault.searchHistory??={};vault.searchHistory[selectedAI]??=[];vault.searchHistory[selectedAI].push({role:'user',text,at:now()});$('family-search-prompt').value='';renderSearchMessages();await save();try{const transcript=vault.searchHistory[selectedAI].slice(-12).map(m=>`${m.role==='user'?'User':NAMES[selectedAI]}: ${m.text}`).join('\n\n');const r=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':vault.ownerCode},body:JSON.stringify({question:`You are ${NAMES[selectedAI]}. Continue this conversation naturally.\n\n${transcript}`,providers:[selectedAI]})});const d=await r.json().catch(()=>({}));const a=(d.answers||[]).find(x=>x.id===selectedAI&&x.ok);if(!r.ok||!a)throw new Error((d.answers||[])[0]?.error||d.error||'AI request failed.');vault.searchHistory[selectedAI].push({role:'ai',text:a.text,at:now()})}catch(e){vault.searchHistory[selectedAI].push({role:'ai',text:`Error: ${e.message}`,at:now()})}await save();renderSearchMessages()}
async function loadStatus(){try{const r=await fetch('/api/ai-council/status',{cache:'no-store'});const d=await r.json();providers=(d.providers||[]).filter(p=>IDS.includes(p.id));els.providerStatus.textContent=`${providers.filter(p=>p.configured).length} of 4 AIs connected`}catch{providers=[];els.providerStatus.textContent='Provider status unavailable'}populateProviders();renderFamilyProviders()}
function populateProviders(preferred){els.botProvider.replaceChildren();for(const p of providers){const o=document.createElement('option');o.value=p.id;o.disabled=!p.configured;o.textContent=`${p.label}${p.configured?` · ${p.model}`:' — not connected'}`;els.botProvider.append(o)}const fallback=providers.find(p=>p.configured)?.id||providers[0]?.id||'';els.botProvider.value=preferred&&providers.some(p=>p.id===preferred)?preferred:fallback}
function initLock(){const exists=!!stored();show(els.setup,!exists);show(els.unlock,exists);show(els.lock,true);show(els.workspace,false)}async function createVault(){const a=els.setupSecret.value,b=els.setupConfirm.value,owner=els.ownerCode.value.trim();if(a.length<6)return err('Use at least 6 characters for the secret key.');if(a!==b)return err('The secret keys do not match.');if(!owner)return err('Enter the owner access code once to authorize this page.');try{const p=providers.find(p=>p.configured);const r=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':owner},body:JSON.stringify({question:'Reply with OK only.',providers:p?[p.id]:[]})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Owner code was not accepted.')}secret=a;vault={member,ownerCode:owner,bots:[],chats:{},searchHistory:{},createdAt:now()};await save();unlockUi()}catch(e){err(e.message||'Could not create this private page.')}}async function unlock(){const record=stored(),pass=els.unlockSecret.value;if(!record)return initLock();try{vault=await openVault(record,pass);secret=pass;vault.bots=(vault.bots||[]).map(b=>b.provider==='perplexity'?{...b,provider:'openai',tools:normalizeTools(b.tools)}:{...b,tools:normalizeTools(b.tools)});vault.searchHistory??={};await save();unlockUi()}catch{err('That secret key is not correct.')}}function unlockUi(){err('');show(els.lock,false);show(els.workspace,true);ensureSearchUi();renderFamilyProviders();renderSearchMessages();renderBots();showSearch()}function lock(){vault=null;secret='';activeBot=null;els.unlockSecret.value='';show(els.workspace,false);$('family-search-composer')?.remove();initLock()}
function renderBots(){els.bots.replaceChildren();const bots=vault?.bots||[];if(!bots.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>No bots yet</strong>Create a private bot for this page.';els.bots.append(e);return}for(const bot of bots){const row=document.createElement('div');row.className='botRow';const icon=document.createElement('div');icon.className='botIcon';icon.style.setProperty('--bot',bot.color||COLORS[0]);icon.textContent=(bot.name||'AI').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();const main=document.createElement('div');const name=document.createElement('div');name.className='botName';name.textContent=bot.name;const last=(vault.chats?.[bot.id]||[]).at(-1);const prev=document.createElement('div');prev.className='botPreview';prev.textContent=last?.text||bot.role||'Ready';main.append(name,prev);const time=document.createElement('div');time.className='botTime';time.textContent=fmt(last?.at);row.append(icon,main,time);row.onclick=()=>openChat(bot.id);row.oncontextmenu=e=>{e.preventDefault();openEditor(bot.id)};els.bots.append(row)}}
function showSearch(){activeBot=null;show($('family-search-view'),true);show(els.botsView,false);show(els.chatView,false);show(els.composer,false);show($('family-search-composer'),true);$('family-search-tab')?.classList.add('active');$('family-bots-tab')?.classList.remove('active');renderSearchMessages()}function showBots(){activeBot=null;show($('family-search-view'),false);show(els.botsView,true);show(els.chatView,false);show(els.composer,false);show($('family-search-composer'),false);$('family-search-tab')?.classList.remove('active');$('family-bots-tab')?.classList.add('active');renderBots()}function openChat(botId){activeBot=vault.bots.find(b=>b.id===botId);if(!activeBot)return;show($('family-search-view'),false);show(els.botsView,false);show(els.chatView,true);show(els.composer,true);show($('family-search-composer'),false);els.chatTitle.textContent=activeBot.name;els.chatRole.textContent=`${activeBot.role||'General expert'} · ${providers.find(p=>p.id===activeBot.provider)?.label||activeBot.provider}`;renderMessages()}
function renderMessages(){els.messages.replaceChildren();for(const m of vault.chats?.[activeBot.id]||[]){const div=document.createElement('div');div.className=`msg ${m.role==='user'?'user':'bot'}`;div.textContent=m.text;els.messages.append(div)}}async function send(){const text=els.prompt.value.trim();if(!text||!activeBot)return;els.prompt.value='';vault.chats[activeBot.id]??=[];vault.chats[activeBot.id].push({role:'user',text,at:now()});renderMessages();const history=vault.chats[activeBot.id].slice(-12).map(m=>`${m.role==='user'?'User':activeBot.name}: ${m.text}`).join('\n\n');try{const r=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':vault.ownerCode},body:JSON.stringify({question:`You are ${activeBot.name}. Role: ${activeBot.role}. Instructions: ${activeBot.instructions}\n\n${history}`,providers:[activeBot.provider]})});const d=await r.json().catch(()=>({}));const a=(d.answers||[]).find(x=>x.id===activeBot.provider&&x.ok);if(!r.ok||!a)throw new Error((d.answers||[])[0]?.error||d.error||'Bot request failed.');vault.chats[activeBot.id].push({role:'assistant',text:a.text,at:now()})}catch(e){vault.chats[activeBot.id].push({role:'assistant',text:`Error: ${e.message}`,at:now()})}await save();renderMessages()}
function openEditor(botId=null){editingId=botId;const b=vault.bots.find(x=>x.id===botId);els.sheetTitle.textContent=b?'Edit Bot':'Create Bot';els.botName.value=b?.name||'';els.botRole.value=b?.role||'';els.botInstructions.value=b?.instructions||'';selectedColor=b?.color||COLORS[vault.bots.length%COLORS.length];populateProviders(b?.provider);els.deleteBot.classList.toggle('hidden',!b);renderPalette();els.sheetBack.classList.add('show');els.sheet.classList.add('show')}function closeEditor(){els.sheetBack.classList.remove('show');els.sheet.classList.remove('show');editingId=null}function renderPalette(){els.palette.replaceChildren();for(const c of COLORS){const b=document.createElement('button');b.type='button';b.className=`color${c===selectedColor?' active':''}`;b.style.background=c;b.onclick=()=>{selectedColor=c;renderPalette()};els.palette.append(b)}}async function saveBot(){const name=els.botName.value.trim(),provider=els.botProvider.value;if(!name||!provider)return;const record={id:editingId||id(),name,role:els.botRole.value.trim()||'General expert',instructions:els.botInstructions.value.trim()||'Be accurate, useful, and concise.',provider,color:selectedColor,tools:normalizeTools(vault.bots.find(b=>b.id===editingId)?.tools)};const i=vault.bots.findIndex(b=>b.id===record.id);if(i>=0)vault.bots[i]=record;else vault.bots.unshift(record);vault.chats[record.id]??=[];await save();closeEditor();renderBots()}async function deleteBot(){if(!editingId)return;const b=vault.bots.find(x=>x.id===editingId);if(!confirm(`Delete ${b?.name||'this bot'}?`))return;vault.bots=vault.bots.filter(x=>x.id!==editingId);delete vault.chats[editingId];await save();closeEditor();showBots()}async function changeKey(){const next=prompt('Enter a new secret key (at least 6 characters):');if(!next||next.length<6)return;secret=next;await save();alert('Secret key changed for this device.')}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-member-name]').forEach(e=>e.textContent=member);$('create-vault').onclick=createVault;$('unlock-btn').onclick=unlock;$('lock-btn').onclick=lock;$('new-bot').onclick=()=>openEditor();$('back-bots').onclick=showBots;$('edit-active').onclick=()=>activeBot&&openEditor(activeBot.id);$('save-bot').onclick=saveBot;$('delete-bot').onclick=deleteBot;$('cancel-bot').onclick=closeEditor;els.sheetBack.onclick=closeEditor;els.send.onclick=send;els.prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('change-key').onclick=changeKey;initLock();loadStatus()});''')

