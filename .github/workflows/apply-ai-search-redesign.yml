name: Apply AI search redesign
on:
  push:
    paths:
      - '.github/workflows/apply-ai-search-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Redesign AI landing and remove Perplexity
        shell: python
        run: |
          from pathlib import Path
          import re

          # Remove Perplexity from the AI backend entirely.
          p = Path('src/aiCouncil.js')
          s = p.read_text()
          s = s.replace('  { id: "perplexity", label: "Perplexity", defaultModel: "sonar-pro" },\n', '')
          s = s.replace('  if (id === "perplexity") return process.env.PERPLEXITY_API_KEY || "";\n', '')
          s = re.sub(r'\nasync function callPerplexity\([\s\S]*?\n}\n\nasync function callProvider', '\nasync function callProvider', s, count=1)
          s = s.replace('  if (id === "perplexity") return callPerplexity(question, system, maxOutputTokens);\n', '')
          p.write_text(s)

          # Main AI landing: simple single-model chat by default, Council behind a tab.
          Path('public/ai-council/index.html').write_text(r'''<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0f"><meta name="color-scheme" content="dark">
