name: Apply AI search redesign
on:
  push:
    paths:
      - '.github/workflows/apply-ai-search-redesign.yml'
      - 'scripts/apply_ai_search_redesign.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply redesign
        run: python scripts/apply_ai_search_redesign.py
      - name: Validate
        run: |
          node --check src/aiCouncil.js
          node --check public/ai-council/family.js
          ! grep -Rni "perplexity" src/aiCouncil.js public/ai-council/index.html public/ai-council/family.js public/ai-council/bots.html
          grep -q "Ask one AI" public/ai-council/index.html
          grep -q "AI Council" public/ai-council/index.html
          grep -q "familyAiSearch" public/ai-council/family.js
      - name: Commit and push
        run: |
          git config user.name "nourie42"
          git config user.email "nourie42@gmail.com"
          git add -A
          git commit -m "Make AI Search the default and remove Perplexity"
          git push
