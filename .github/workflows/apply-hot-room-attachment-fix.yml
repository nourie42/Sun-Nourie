name: Apply Hot Room attachment fix
on:
  push:
    paths:
      - 'scripts/fix_hot_room_attachment_transport.py'
      - '.github/workflows/apply-hot-room-attachment-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hot Room fix
        run: python scripts/fix_hot_room_attachment_transport.py
      - name: Syntax check
        run: |
          node --check src/aiAgent.js
          node --check public/ai-council/bots-v2.js
      - name: Verify Hot Room transport fix
        run: |
          grep -q '/api/ai-agent/attachment/prepare' src/aiAgent.js
          grep -q 'prepareRoomAttachments' public/ai-council/bots-v2.js
          grep -q 'preparedAttachmentText' src/aiAgent.js
          grep -q 'Attached file context' src/aiAgent.js
      - name: Commit changes
        run: |
          git config user.name 'nourie42'
          git config user.email 'nourie42@gmail.com'
          git add src/aiAgent.js public/ai-council/bots-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Hot Room attachment transport and context'
          git push
