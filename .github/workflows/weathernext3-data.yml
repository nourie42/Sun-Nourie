name: WeatherNext 3 point forecast data
# WIF setup verified

on:
  push:
    branches: [main]
    paths:
      - 'scripts/weather_weathernext3_collect.py'
      - '.github/workflows/weathernext3-data.yml'
  schedule:
    # Main 00/06/12/18 UTC runs reach BigQuery about 8h10m later.
    - cron: '25 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: weathernext3-point-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEATHERNEXT_BQ_TABLE: homeassist-470415.weathernext_3.weathernext_3_0_0_0p1deg
      GOOGLE_PROJECT_ID: homeassist-470415
      GOOGLE_SERVICE_ACCOUNT: weather-fusion-github@homeassist-470415.iam.gserviceaccount.com
      GOOGLE_WORKLOAD_IDENTITY_PROVIDER: projects/269512183833/locations/global/workloadIdentityPools/github-actions/providers/sun-nourie

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ env.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}

      - name: Install BigQuery client
        run: pip install 'google-cloud-bigquery>=3.25,<4'

      - name: Open isolated public-weather data worktree
        shell: bash
        run: |
          DATA="$RUNNER_TEMP/weather-fusion-publish"
          git fetch --depth=1 origin weather-fusion-data
          git worktree add --detach "$DATA" FETCH_HEAD
          git -C "$DATA" config user.name 'github-actions[bot]'
          git -C "$DATA" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "WEATHER_DATA_DIR=$DATA" >> "$GITHUB_ENV"

      - name: Query hosted WeatherNext 3
        run: |
          python scripts/weather_weathernext3_collect.py \
            --table "$WEATHERNEXT_BQ_TABLE" \
            --output "$WEATHER_DATA_DIR/models/weathernext3.json"

      - name: Publish compact WeatherNext 3 feed
        shell: bash
        run: |
          cd "$WEATHER_DATA_DIR"
          git add -- models/weathernext3.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Google WeatherNext 3 point forecasts'
            git push origin HEAD:weather-fusion-data
          fi
