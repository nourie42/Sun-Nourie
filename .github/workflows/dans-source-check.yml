name: Compare official discussion freshness
on:
  push:
    branches: [fix/dans-take-request-lifecycle]
    paths: ['.github/workflows/dans-source-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          mkdir -p /tmp/dans-source-check
          node --input-type=module - <<'JS'
          import fs from 'node:fs/promises';
          const urls=[
            'https://api.weather.gov/openapi.json',
            'https://api.weather.gov/products/types/AFD/locations/RAH',
            'https://api.weather.gov/products/types/AFD/locations/RAH/latest',
            'https://api.weather.gov/products?type=AFD&location=RAH',
            'https://forecast.weather.gov/product.php?site=NWS&issuedby=RAH&product=AFD&format=TXT&version=1&glossary=0',
            'https://tgftp.nws.noaa.gov/data/forecasts/discussion/rah.txt'
          ];
          await Promise.all(urls.map(async(url,i)=>{
            try{
              const r=await fetch(url,{headers:{'User-Agent':'Weather-Nourie-source-verification','Cache-Control':'no-cache'},signal:AbortSignal.timeout(25000),redirect:'manual'}),text=await r.text();
              await fs.writeFile('/tmp/dans-source-check/source-'+i+'.txt',text);
              let summary=text.slice(0,500);
              try{const d=JSON.parse(text);summary=url.endsWith('openapi.json')?Object.fromEntries(Object.entries(d.paths||{}).filter(([key])=>key.startsWith('/products'))):{id:d.id,issuanceTime:d.issuanceTime,issuingOffice:d.issuingOffice,productCode:d.productCode,text:d.productText?.slice(0,500),graph:(d['@graph']||[]).slice(0,5)};}catch{}
              console.log('OFFICIAL_SOURCE',JSON.stringify({url,status:r.status,location:r.headers.get('location'),age:r.headers.get('age'),lastModified:r.headers.get('last-modified'),summary}));
            }catch(e){console.log('SOURCE_ERROR',url,e.message);}
          }));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: dans-official-source-check
          path: /tmp/dans-source-check
          retention-days: 7
