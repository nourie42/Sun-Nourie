name: Verify wave and outlook time fix
on:
  push:
    branches:
      - fix/wave-time-format
    paths:
      - '.github/workflows/fix-wave-time-format.yml'
      - 'scripts/patch_wave_time.py'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrowly scoped patch
        run: python scripts/patch_wave_time.py
      - name: Syntax checks
        run: |
          node --check src/weatherFusion.js
          node --check src/weatherFusionExperience.js
          node --check public/weather-fusion/exposure-scene.js
      - run: npm ci
      - name: All Weather Nourie regression tests
        run: node --test test/weatherFusion*.test.js
      - name: Existing website regression checks
        run: npm run check
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Responsive browser regression
        run: node scripts/weatherFusionPersonalBrowser.js
      - name: Commit only the verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-wave-time-format.yml scripts/patch_wave_time.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix intermittent waving arms and numeric outlook times'
          git push origin HEAD:fix/wave-time-format
