name: Deal Lens parity report

# Runs only on deal-lens-parity. The company workbook is mounted on Render,
# outside this public repository. Local and Render checks need no encryption key.
on:
  push:
    branches: [deal-lens-parity]
    paths:
      - scripts/dealLensParityReport.mjs
      - public/deal-lens/**
      - src/dealLensRoutes.js
      - src/dealLensModelAssets.js
      - src/weatherSiteAccess.js
      - data/deal-lens/**
      - test/dealLens*.test.js
      - test/weatherSiteAccess.test.js
      - .github/workflows/deal-lens-parity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    if: github.ref == 'refs/heads/deal-lens-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Deal Lens and access regressions
        run: node --test test/dealLens*.test.js test/weatherSiteAccess.test.js
      - name: Run parity report (synthetic numbers only)
        run: node scripts/dealLensParityReport.mjs docs/deal-lens-parity-status.json
      - name: Save the report on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deal-lens-parity-status.json
          git diff --cached --quiet || (git commit -m "Record Deal Lens parity report [skip ci]" && git push)
