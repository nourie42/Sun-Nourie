name: Verify Weather Nourie UI requests
on:
  push:
    branches: [fix/weather-ui-confidence-clothing, main]
    paths:
      - 'public/weather-fusion/**'
      - 'src/weatherFusion*.js'
      - 'test/weatherFusion*.test.js'
      - 'scripts/ui_patch_part_*.b64'
      - 'scripts/weatherFusionPersonalBrowser.js'
      - '.github/workflows/weather-ui-requests.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-ui-requests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/weather-ui-confidence-clothing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact reviewed UI patch
        run: |
          cat scripts/ui_patch_part_*.b64 | base64 -d >/tmp/patch_weather_ui_requests.py
          python /tmp/patch_weather_ui_requests.py
          node --check src/weatherFusion.js
          node --check src/weatherFusionExperience.js
          node --check public/weather-fusion/experience.js
          node --check public/weather-fusion/exposure-scene.js
          node --check public/weather-fusion/dans-take.js
          node --check public/weather-fusion/personal-details.js
      - run: npm ci
      - name: All weather unit regressions
        run: |
          if node --test test/weatherFusion*.test.js >/tmp/weather-ui-unit.log 2>&1; then tail -12 /tmp/weather-ui-unit.log; else cat /tmp/weather-ui-unit.log; exit 1; fi
      - name: Existing website checks
        run: npm run check
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium >/tmp/weather-ui-install.log 2>&1 || (tail -30 /tmp/weather-ui-install.log; exit 1)
      - name: Six-width actual browser regression
        run: node scripts/weatherFusionPersonalBrowser.js >/tmp/weather-ui-browser.log 2>&1 || (tail -100 /tmp/weather-ui-browser.log; exit 1)
      - name: Commit only verified requested weather UI changes
        run: |
          set -euo pipefail
          cp /tmp/weather-personal-results/report.json docs/weather-ui-requests-browser-proof.json
          cp /tmp/weather-ui-unit.log docs/weather-ui-requests-unit-proof.log
          rm scripts/ui_patch_part_*.b64
          git add -A
          python - <<'PY'
          import json,subprocess
          proof=json.load(open('docs/weather-ui-requests-browser-proof.json'))
          assert proof['success'] and len(proof['centeringChecks'])==6
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only','ffd0c01d10884a9f1395873cd0ef8bf5282f87d0'],text=True).splitlines())
          allowed_prefixes=['public/weather-fusion/','src/weatherFusion','test/weatherFusion','docs/weather-ui-requests','scripts/weatherFusionPersonalBrowser.js']
          allowed_exact={'.github/workflows/weather-ui-requests.yml'}
          assert all(path in allowed_exact or any(path.startswith(prefix) for prefix in allowed_prefixes) for path in changed),changed
          assert 'public/weather-fusion/forecast-confidence.js' in changed
          assert 'public/weather-fusion/exposure-scene.js' in changed
          print('Verified UI-request diff:',sorted(changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Add scientific daily confidence, weather-matched clothing and direct grouped Dan take"
          git push origin HEAD:fix/weather-ui-confidence-clothing
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-ui-request-proof
          path: |
            /tmp/weather-ui-*.log
            /tmp/weather-personal-results
          retention-days: 7
