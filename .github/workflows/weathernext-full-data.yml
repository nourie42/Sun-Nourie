name: WeatherNext full surface forecast feed
on:
  push:
    branches: [main]
    paths:
      - scripts/weather_weathernext_site_collect.py
      - public/weather-fusion/weathernext-catalog.json
      - .github/workflows/weathernext-full-data.yml
      - scripts/test_weathernext_collection.py
      - scripts/publish_weathernext_data.sh
  schedule:
    # Main 00/06/12/18 UTC runs reach BigQuery about 8h10m later.
    # Leave publication margin; GitHub may delay scheduled jobs.
    - cron: '45 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: weathernext-full-surface-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v3
        with:
          project_id: homeassist-470415
          workload_identity_provider: projects/269512183833/locations/global/workloadIdentityPools/github-actions/providers/sun-nourie
      - run: pip install 'google-cloud-bigquery>=3.25,<4'
      - name: Check collector freshness and billing safeguards
        run: python scripts/test_weathernext_collection.py
      - name: Open isolated forecast data worktree
        run: |
          DATA="$RUNNER_TEMP/weathernext-publish"
          git fetch --depth=1 origin weather-fusion-data
          git worktree add --detach "$DATA" FETCH_HEAD
          git -C "$DATA" config user.name 'github-actions[bot]'
          git -C "$DATA" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "WEATHER_DATA_DIR=$DATA" >> "$GITHUB_ENV"
      - name: Collect the latest main surface run in smaller bounded batches
        id: surface
        run: |
          python -u scripts/weather_weathernext_site_collect.py --table homeassist-470415.weathernext_3.weathernext_3_0_0_0p1deg --output "$WEATHER_DATA_DIR/models/weathernext-full.json" --max-bytes-per-query 700000000000 --profile surface --billing-state "$RUNNER_TEMP/weathernext-billing.json"
      - name: Publish verified main forecast before optional collection
        if: always() && env.WEATHER_DATA_DIR != ''
        run: bash scripts/publish_weathernext_data.sh
      - name: Collect optional station and interim runs within the same billing budget
        if: steps.surface.outcome == 'success'
        run: |
          python -u scripts/weather_weathernext_site_collect.py --table homeassist-470415.weathernext_3.weathernext_3_0_0_0p1deg --output "$WEATHER_DATA_DIR/models/weathernext-full.json" --max-bytes-per-query 700000000000 --profile all --billing-state "$RUNNER_TEMP/weathernext-billing.json"
      - name: Preserve verified feed or cost-stop marker even after a failed collection
        if: always() && env.WEATHER_DATA_DIR != ''
        run: bash scripts/publish_weathernext_data.sh
