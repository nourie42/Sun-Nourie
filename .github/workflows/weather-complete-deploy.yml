name: Verify complete Weather Nourie repair
# all ten reviewed repair chunks are present
on:
  push:
    branches: [fix/weather-complete-deploy]
    paths:
      - '.github/workflows/weather-complete-deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-complete-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the reviewed repair bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '5514cf80ad75b5497751cb4909151983d2894260213bb927b33a38b33994ad0c  .weather-release/chunk00' | sha256sum -c -
          echo 'e7f5722d61051b69c18fbee2b83e77d37410643bfb6896b448bf7b3de347d888  .weather-release/chunk01' | sha256sum -c -
          echo 'ab93250a033cd48d3a56740a9f1a5d5e4f66934a10c1286b50da238bf6231900  .weather-release/chunk02' | sha256sum -c -
          echo '87a7541cbeef3588d2540c79bb198abbaa265b552c72f7b81937b96edbabbd60  .weather-release/chunk03' | sha256sum -c -
          echo 'beccf57c83cd0520cfb845d33e6372a5e7ced4f1f369d2ffec797a19bdecc1e5  .weather-release/chunk04' | sha256sum -c -
          echo 'ce59c2fd1d6aa239cc73dfca5eb9da62b509a5e0218be0e50089c8b1eb1cd1c0  .weather-release/chunk05' | sha256sum -c -
          echo '488adfbdcf378ca9da76fa3f171378bbc14ecc30b4250b6f6f84ce080cd5f1f6  .weather-release/chunk06' | sha256sum -c -
          echo 'a8c1d49e4e8eb67a04c4255960aa532146f80d6cc61c5f0796b952a575729a86  .weather-release/chunk07' | sha256sum -c -
          echo 'a4999d7c95fdaef6b3181b13dfd18c7448cc3ee98d2e2cdd9d9805fca16ebdaa  .weather-release/chunk08' | sha256sum -c -
          echo '8e9214269690f0251497f9a946aeffe721be711c5ac90fa809563ec534b35382  .weather-release/chunk09' | sha256sum -c -
          cat .weather-release/chunk{00..09} > /tmp/weather-repair.b64
          base64 -d /tmp/weather-repair.b64 > /tmp/weather-repair.patch.xz
          echo 'af107ad35ab607663ca9b528d6a82040640b39fe71419ec841bd1b76c1b1cee4  /tmp/weather-repair.patch.xz' | sha256sum -c -
          xz -dc /tmp/weather-repair.patch.xz > /tmp/weather-repair.patch
          echo 'cf555137bcbcc90d8fb746efef75b474a52d64a0f94e3eaa66f373917040bda2  /tmp/weather-repair.patch' | sha256sum -c -
          patch -p1 --batch --forward --dry-run < /tmp/weather-repair.patch
          patch -p1 --batch --forward < /tmp/weather-repair.patch
      - run: npm ci
      - name: JavaScript syntax checks
        run: |
          find public/weather-fusion -name '*.js' -print0 | xargs -0 -n1 node --check
          find src -name 'weatherFusion*.js' -print0 | xargs -0 -n1 node --check
      - name: All Weather Nourie regression tests
        run: node --test test/weatherFusion*.test.js
      - name: Existing website regression checks
        run: npm run check
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Responsive browser integration checks
        env:
          WEATHER_REPORT_DIR: /tmp/weather-complete-browser
        run: node scripts/weatherFusionPersonalBrowser.js
      - name: Verify release file set and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .weather-release/repair.patch.xz .weather-release/chunk{00..09} .github/workflows/weather-complete-deploy.yml
          rmdir .weather-release 2>/dev/null || true
          python - <<'PY'
          import subprocess
          expected=set('''
          test/weatherFusionEvening.test.js
          test/weatherFusionDirect.test.js
          test/weatherFusionSkyConsistency.test.js
          test/weatherFusionExperience.test.js
          test/weatherFusionForecastDetails.test.js
          test/weatherFusionPersonalDetails.test.js
          test/weatherFusionHourlyConsistency.test.js
          src/weatherFusionHrrrMap.js
          src/weatherFusionHourlyFeels.js
          src/weatherFusionDirect.js
          src/weatherFusion.js
          public/weather-fusion/comfort-outlook.js
          public/weather-fusion/exposure-scene.js
          public/weather-fusion/weather-display.js
          public/weather-fusion/weather-state.js
          public/weather-fusion/utci.js
          public/weather-fusion/index.html
          public/weather-fusion/app.js
          public/weather-fusion/hourly-feels.css
          public/weather-fusion/frame-player.js
          public/weather-fusion/experience.js
          public/weather-fusion/personal-details.js
          public/weather-fusion/weather-math.js
          public/weather-fusion/weather-repair.css
          '''.split())
          actual=set(subprocess.check_output(['git','diff','--name-only','493782fc3e173d74f47aefdb9f9de95645aaa443'],text=True).split())
          if actual != expected:
              print('Unexpected release diff. Missing:',sorted(expected-actual),'Extra:',sorted(actual-expected))
              raise SystemExit(1)
          print('Reviewed release file set verified:',len(actual),'files')
          PY
      - name: Commit exactly the tested repair to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Weather Nourie feels-like consistency, weather exposure, radar and HRRR maps'
          git push origin HEAD:fix/weather-complete-deploy
          echo "Tested commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-complete-browser-results
          path: /tmp/weather-complete-browser
          retention-days: 7
