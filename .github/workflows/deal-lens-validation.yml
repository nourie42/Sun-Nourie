name: Validate Deal Lens (COOP workbook)

on:
  pull_request:
    paths:
      - 'public/deal-lens/**'
      - 'test/dealLens*.test.js'
      - '.github/workflows/deal-lens-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'public/deal-lens/**'
      - 'test/dealLens*.test.js'
      - '.github/workflows/deal-lens-validation.yml'

jobs:
  deal-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check Deal Lens syntax
        run: |
          node --check public/deal-lens/app.js
          node --check public/deal-lens/leadership-report.js
          node --check public/deal-lens/plain-intake.js
          node --check public/deal-lens/paste-intake.js
          node --check public/deal-lens/original-model.js
          node --check public/deal-lens/original-export.js
          node --check public/deal-lens/intake-model-ui.js
      - name: Run Deal Lens regression tests
        run: node --test test/dealLensParity.test.js test/dealLensUiState.test.js test/dealLensCoopOfferExport.test.js test/dealLensManualCorrections.test.js test/dealLensHosting.test.js test/dealLensLeadershipReport.test.js
