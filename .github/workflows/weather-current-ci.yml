name: Verify current Weather Nourie browser checks
on:
  push:
    branches: [fix/weather-current-ci]
    paths:
      - 'scripts/patch_weather_current_ci.py'
      - '.github/workflows/weather-current-ci.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/patch_weather_current_ci.py
      - run: npm ci
      - run: node --test test/weatherFusion*.test.js
      - run: npm run check
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Responsive browser regression
        run: node scripts/weatherFusionPersonalBrowser.js
      - name: Commit verified browser expectations
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch_weather_current_ci.py .github/workflows/weather-current-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python - <<'PY'
          import subprocess
          expected={'scripts/weatherFusionBrowserSmoke.js','scripts/weatherFusionPersonalBrowser.js'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','bda996fd98d0dd8b0ba9e23fd5193967c37fc6fa'],text=True).split())
          if actual!=expected:
              print('Unexpected files. Missing:',sorted(expected-actual),'Extra:',sorted(actual-expected)); raise SystemExit(1)
          PY
          git commit -m 'Align weather browser checks with current thermal model'
          git push origin HEAD:fix/weather-current-ci
