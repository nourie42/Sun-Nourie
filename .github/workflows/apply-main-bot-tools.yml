# trigger: main bot tools mirror
name: Apply main bot tools
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-main-bot-tools.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main Bot Studio and Bot Chat
        shell: python
        run: |
          from pathlib import Path

          bots_path = Path('public/ai-council/bots.html')
          s = bots_path.read_text()

          css_anchor = ".sheetActions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.fileInput{display:none}"
          css_new = css_anchor + ".toolPanel{grid-column:1/-1;margin-top:4px;padding:14px;border:1px solid #303037;border-radius:16px;background:#111115}.toolPanelTitle{font-weight:900;font-size:14px;margin-bottom:4px}.toolPanelIntro{color:#777780;font-size:11px;line-height:1.45;margin-bottom:10px}.toolToggle{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid #26262c}.toolToggle:first-of-type{border-top:0}.toolToggle input{margin-top:4px;accent-color:#fff}.toolToggle b{display:block;font-size:12px}.toolToggle small{display:block;color:#777780;font-size:10px;line-height:1.4;margin-top:2px}.toolBadgeRow{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.toolBadge{font-size:9px;padding:3px 6px;border:1px solid #35353c;border-radius:999px;color:#a7a7af;background:#151519}"
          if css_anchor in s and '.toolPanel{' not in s:
              s = s.replace(css_anchor, css_new, 1)

          form_anchor = "        <div class=\"full\"><label class=\"fieldLabel\" for=\"botInstructions\">Custom instructions</label><textarea class=\"fieldText\" id=\"botInstructions\" maxlength=\"3500\" placeholder=\"Tell this bot exactly what it should do, how it should think, what it should verify, and how it should work with other bots.\"></textarea></div>"
          tool_html = form_anchor + "\n        <div class=\"toolPanel\"><div class=\"toolPanelTitle\">Tools & Permissions</div><div class=\"toolPanelIntro\">Tools are off by default. Turn on only what this bot should be allowed to use.</div><label class=\"toolToggle\"><input id=\"toolWebSearch\" type=\"checkbox\"><span><b>⌕ Web Search</b><small>Live research through Perplexity when connected.</small></span></label><label class=\"toolToggle\"><input id=\"toolGmail\" type=\"checkbox\"><span><b>✉ Gmail</b><small>Permission only for now; Google OAuth still has to be connected.</small></span></label><label class=\"toolToggle\"><input id=\"toolBrowser\" type=\"checkbox\"><span><b>◎ Browser</b><small>Permission only for now; remote browser/computer still has to be connected.</small></span></label><label class=\"toolToggle\"><input id=\"toolShopping\" type=\"checkbox\"><span><b>🛒 Shopping / Cart</b><small>Product research can use Web Search. Cart and checkout require browser connection and explicit approval.</small></span></label></div>"
          if form_anchor in s and 'id="toolWebSearch"' not in s:
              s = s.replace(form_anchor, tool_html, 1)

          els_anchor = "deleteBotBtn:document.getElementById('deleteBotBtn'),cancelBotBtn:document.getElementById('cancelBotBtn'),saveBotBtn:document.getElementById('saveBotBtn')"
          els_new = els_anchor[:-1] + ",toolWebSearch:document.getElementById('toolWebSearch'),toolGmail:document.getElementById('toolGmail'),toolBrowser:document.getElementById('toolBrowser'),toolShopping:document.getElementById('toolShopping')}"
          if els_anchor in s and 'toolWebSearch:document.getElementById' not in s:
              s = s.replace(els_anchor, els_new, 1)

          helper_anchor = "    function currentPreview(bot){const a=activity[bot.id];if(a?.preview)return a.preview;return bot.role||'Ready for a new task'}"
          helper_new = helper_anchor + "\n    function normalizeTools(t){return{webSearch:!!t?.webSearch,gmail:!!t?.gmail,browser:!!t?.browser,shopping:!!t?.shopping}}\n    function toolLabels(bot){const t=normalizeTools(bot?.tools),out=[];if(t.webSearch)out.push('⌕ Web Search');if(t.gmail)out.push('✉ Gmail');if(t.browser)out.push('◎ Browser');if(t.shopping)out.push('🛒 Shopping');return out}"
          if helper_anchor in s and 'function normalizeTools' not in s:
              s = s.replace(helper_anchor, helper_new, 1)

          main_append_anchor = "main.append(line,preview);"
          main_append_new = "main.append(line,preview);const tools=toolLabels(bot);if(tools.length){const tr=document.createElement('div');tr.className='toolBadgeRow';tools.forEach(label=>{const tb=document.createElement('span');tb.className='toolBadge';tb.textContent=label;tr.append(tb)});main.append(tr);}"
          if main_append_anchor in s and 'toolBadgeRow' not in s[s.find('function renderBots'):s.find('function renderPicker')]:
              s = s.replace(main_append_anchor, main_append_new, 1)

          open_anchor = "populateProviderSelect(bot?.provider);els.deleteBotBtn.classList.toggle('hidden',!bot);renderPalette();"
          open_new = "populateProviderSelect(bot?.provider);const tools=normalizeTools(bot?.tools);els.toolWebSearch.checked=tools.webSearch;els.toolGmail.checked=tools.gmail;els.toolBrowser.checked=tools.browser;els.toolShopping.checked=tools.shopping;els.deleteBotBtn.classList.toggle('hidden',!bot);renderPalette();"
          if open_anchor in s and 'els.toolWebSearch.checked' not in s:
              s = s.replace(open_anchor, open_new, 1)

          save_anchor = "const record={id:editingId||id(),name,role:role||'General expert',instructions:instructions||'Be accurate, useful, and collaborate constructively with the other bots.',provider,color:selectedColor};"
          save_new = "const record={id:editingId||id(),name,role:role||'General expert',instructions:instructions||'Be accurate, useful, and collaborate constructively with the other bots.',provider,color:selectedColor,tools:{webSearch:els.toolWebSearch.checked,gmail:els.toolGmail.checked,browser:els.toolBrowser.checked,shopping:els.toolShopping.checked}};"
          if save_anchor in s:
              s = s.replace(save_anchor, save_new, 1)

          import_anchor = "instructions:String(b.instructions||'').slice(0,3500),color:b.color||COLORS[i%COLORS.length]})"
          import_new = "instructions:String(b.instructions||'').slice(0,3500),color:b.color||COLORS[i%COLORS.length],tools:normalizeTools(b.tools)})"
          if import_anchor in s:
              s = s.replace(import_anchor, import_new, 1)

          bots_path.write_text(s)

          chat_path = Path('public/ai-council/chat.html')
          c = chat_path.read_text()

          style_anchor = ".warning{border:1px solid rgba(255,33,70,.24);background:rgba(255,33,70,.07);color:#ff99aa;padding:10px 12px;border-radius:13px;font-size:11px;line-height:1.45;margin:10px 0}"
          style_new = style_anchor + ".toolStrip{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.toolChip{font-size:9px;padding:4px 7px;border:1px solid #303036;border-radius:999px;color:#a7a7af;background:#151519}.toolChip.ready{color:#8fe2b8;border-color:#285c45}.toolChip.wait{color:#e0b45b;border-color:#5b4d2e}"
          if style_anchor in c and '.toolStrip{' not in c:
              c = c.replace(style_anchor, style_new, 1)

          header_anchor = "      <div class=\"warning hidden\" id=\"warning\"></div>\n      <div class=\"messages\" id=\"messages\"></div>"
          header_new = "      <div class=\"warning hidden\" id=\"warning\"></div>\n      <div class=\"toolStrip\" id=\"toolStrip\"></div>\n      <div class=\"messages\" id=\"messages\"></div>"
          if header_anchor in c and 'id="toolStrip"' not in c:
              c = c.replace(header_anchor, header_new, 1)

          els_anchor = "clearAllBtn:document.getElementById('clearAllBtn')}"
          if els_anchor in c:
              c = c.replace(els_anchor, "clearAllBtn:document.getElementById('clearAllBtn'),toolStrip:document.getElementById('toolStrip')}", 1)

          helper_anchor = "  function warn(text){els.warning.textContent=text||'';els.warning.classList.toggle('hidden',!text)}"
          helper_new = helper_anchor + "\n  function normalizeTools(t){return{webSearch:!!t?.webSearch,gmail:!!t?.gmail,browser:!!t?.browser,shopping:!!t?.shopping}}\n  function renderTools(bot){els.toolStrip.replaceChildren();const t=normalizeTools(bot?.tools);const defs=[['webSearch','⌕ Web Search',providers.some(p=>p.id==='perplexity'&&p.configured)],['gmail','✉ Gmail',false],['browser','◎ Browser',false],['shopping','🛒 Shopping',t.webSearch&&providers.some(p=>p.id==='perplexity'&&p.configured)]];defs.filter(([k])=>t[k]).forEach(([k,label,ready])=>{const chip=document.createElement('span');chip.className='toolChip '+(ready?'ready':'wait');chip.textContent=label+(ready?' · ready':' · connection needed');els.toolStrip.append(chip)})}\n  async function webResearch(text,code){const t=normalizeTools(currentBot?.tools);if(!t.webSearch)return{text:'',citations:[]};const p=providers.find(p=>p.id==='perplexity'&&p.configured);if(!p)throw new Error('Web Search is enabled for this bot, but PERPLEXITY_API_KEY is not connected.');const r=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':code},body:JSON.stringify({question:`Search the live web for current information that helps answer this user request. Return concise factual research with source support. Request: ${text}`,providers:['perplexity']})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Web search failed.');const a=safeArray(d.answers).find(x=>x.ok&&x.id==='perplexity');if(!a)throw new Error(safeArray(d.answers)[0]?.error||'Web search did not return results.');return{text:a.text||'',citations:safeArray(a.citations)}}"
          if helper_anchor in c and 'async function webResearch' not in c:
              c = c.replace(helper_anchor, helper_new, 1)

          open_anchor = "warn(configured(bot)?'':`${pLabel(bot)} is not configured yet.`);renderMessages();"
          open_new = "warn(configured(bot)?'':`${pLabel(bot)} is not configured yet.`);renderTools(bot);renderMessages();"
          if open_anchor in c:
              c = c.replace(open_anchor, open_new, 1)

          close_anchor = "warn('');history.replaceState(null,'','/ai-council/chat.html');renderList()"
          close_new = "warn('');els.toolStrip.replaceChildren();history.replaceState(null,'','/ai-council/chat.html');renderList()"
          if close_anchor in c:
              c = c.replace(close_anchor, close_new, 1)

          send_anchor = "const response=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':code},body:JSON.stringify({question:buildQuestion(text),providers:[currentBot.provider]})});"
          send_new = "const research=await webResearch(text,code);const toolNotes=[];const tools=normalizeTools(currentBot.tools);if(tools.gmail)toolNotes.push('Gmail permission is enabled, but no Google OAuth connection is active on this site yet. Do not claim to have read or changed Gmail.');if(tools.browser)toolNotes.push('Browser permission is enabled, but no remote browser/computer connection is active yet. Do not claim to have clicked or navigated websites.');if(tools.shopping)toolNotes.push('Shopping permission is enabled. You may use supplied web research for product recommendations, but do not claim to add items to a cart or checkout until a browser connection exists and the user explicitly approves purchase actions.');const enriched=[buildQuestion(text),research.text?`Live web research supplied to this bot:\n${research.text}`:'',toolNotes.length?`Tool status:\n${toolNotes.join('\\n')}`:''].filter(Boolean).join('\\n\\n');const response=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':code},body:JSON.stringify({question:enriched,providers:[currentBot.provider]})});"
          if send_anchor in c and 'const research=await webResearch' not in c:
              c = c.replace(send_anchor, send_new, 1)

          cite_anchor = "latestArr.push({role:'bot',text:answer.text,at:now,citations:answer.citations||[]});"
          cite_new = "latestArr.push({role:'bot',text:answer.text,at:now,citations:[...new Set([...(research?.citations||[]),...(answer.citations||[])])]});"
          if cite_anchor in c:
              c = c.replace(cite_anchor, cite_new, 1)

          chat_path.write_text(c)
      - name: Validate changed browser scripts
        run: |
          node scripts/validateAiCouncilBots.js
          node scripts/validateAiCouncilSingleChat.js
      - name: Commit and push
        run: |
          git config user.name "nourie42"
          git config user.email "nourie42@gmail.com"
          git add public/ai-council/bots.html public/ai-council/chat.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Mirror bot tools on main Bot Studio"
          git push
