<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="what's up">
  <title>what's up</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --text: #f4f7fb;
      --muted: #9eb0c7;
      --accent: #5eead4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(94, 234, 212, 0.16), transparent 58%),
        linear-gradient(180deg, #0b1624 0%, var(--bg) 72%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: min(100%, 36rem);
      text-align: center;
    }
    p.eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 12vw, 5.4rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.95;
    }
    p.sub {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 3.4vw, 1.2rem);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">hello</p>
    <h1>what's up</h1>
    <p class="sub">Just checking in. Everything’s good here.</p>
  </main>
</body>
</html>
