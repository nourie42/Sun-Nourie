<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <meta name="color-scheme" content="dark">
  <title>Ultimate Weather</title>
  <link rel="stylesheet" href="/weather-fusion/ultimate.css?v=4">
</head>
<body>
<div class="sky" id="sky"><div class="sky-shade"></div></div>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/weather-fusion/"><span>Weather <b>Nourie</b></span></a>
    <span class="page-tag">Ultimate</span>
  </header>

  <div class="loc-row">
    <select class="loc-select" id="loc-select" aria-label="Location">
      <option value="knightdale">Knightdale / Raleigh</option>
      <option value="greenville">Greenville, NC</option>
    </select>
    <span class="updated" id="updated"></span>
  </div>
  <div id="alert-strip" class="alert-strip" hidden></div>

  <!-- HERO — Apple style -->
  <section class="hero">
    <div class="hero-loc" id="hero-loc">Knightdale</div>
    <div class="hero-temp"><span id="now-temp">--</span>°</div>
    <div class="hero-cond" id="now-cond">Loading…</div>
    <div class="hero-hilo" id="now-hilo">H --&nbsp;&nbsp;L --</div>
  </section>

  <nav class="tab-bar glass">
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="models">Models</button>
    <button data-tab="ailab">AI Lab</button>
    <button data-tab="details">Details</button>
  </nav>

  <main>
    <section id="tab-overview" class="tab-panel on">
      <div class="glass card">
        <div class="card-desc" id="hourly-desc"></div>
        <div class="divider"></div>
        <div class="hourly-strip" id="hourly-strip"></div>
      </div>

      <div class="glass card">
        <div class="card-desc" id="daily-desc"></div>
        <div class="divider"></div>
        <div class="day-list" id="day-list"></div>
      </div>

      <div class="tile-grid" id="metric-grid"></div>
    </section>

    <section id="tab-models" class="tab-panel">
      <div class="glass card">
        <div class="card-head"><h2>Model Blend</h2><div class="blend-weights" id="blend-weights"></div></div>
        <div class="divider"></div>
        <div class="chart" id="blend-chart"></div>
      </div>
      <div class="glass card">
        <h2>Per-Model Now</h2>
        <div class="divider"></div>
        <div class="tile-grid" id="model-cards"></div>
      </div>
      <div class="glass card">
        <h2>WeatherNext AI</h2>
        <div class="divider"></div>
        <div class="chart" id="wn-chart"></div>
        <p class="fine" id="wn-note"></p>
      </div>
    </section>

    <section id="tab-ailab" class="tab-panel">
      <div class="glass card">
        <h2>WeatherNext Explorer</h2>
        <div class="divider"></div>
        <div class="var-grid" id="wn-var-grid"></div>
      </div>
      <div class="glass card">
        <h2 id="wn-chart-title">AI Forecast</h2>
        <div class="divider"></div>
        <div class="chart" id="wn-chart2"></div>
        <p class="fine" id="wn-age"></p>
      </div>
    </section>

    <section id="tab-details" class="tab-panel">
      <div class="glass card">
        <h2>Comfort</h2>
        <div class="divider"></div>
        <div id="comfort-box"></div>
      </div>
      <div class="glass card">
        <h2>Details</h2>
        <div class="divider"></div>
        <dl class="detail-list" id="detail-list"></dl>
      </div>
      <div class="glass card">
        <h2>Forecaster Discussion</h2>
        <div class="divider"></div>
        <div id="discussion"></div>
      </div>
    </section>
  </main>

  <p id="error" class="error" hidden></p>
  <footer class="foot">Data: NWS, HRRR, NBM, ECMWF, Google WeatherNext AI.<br><a href="/weather-fusion/">All weather pages →</a></footer>
</div>
<script type="module" src="/weather-fusion/ultimate.js?v=4"></script>
</body>
</html>
