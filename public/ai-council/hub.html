<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Talk to Grok, Muse, Claude, and ChatGPT on one page.">
  <title>My AIs</title>
  <style>
    :root{--bg:#0d0d0f;--panel:#151518;--line:#2d2d33;--text:#f4f4f6;--muted:#8b8b94;--grok:#e8e8ec;--muse:#4f8cff;--claude:#d97757;--chatgpt:#10a37f;--red:#ff9bad}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit}
    .app{height:100vh;height:100dvh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .orb{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--grok),var(--muse),var(--claude),var(--chatgpt),var(--grok));display:grid;place-items:center;flex:0 0 auto}
    .orb span{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:950;font-size:11px}
    h1{margin:0;font-size:19px;letter-spacing:-.03em}
    .sub{font-size:11px;color:var(--muted);margin-top:2px}
    .head-actions{display:flex;gap:6px}
    .pill{border:1px solid var(--line);background:#18181c;color:#ddd;border-radius:12px;min-height:38px;padding:0 11px;font-size:11px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
    .tabs{display:none;gap:6px;padding:0 16px 8px;overflow-x:auto}
    .tabs button{flex:1;border:1px solid var(--line);background:#17171b;color:#999;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:850;white-space:nowrap;cursor:pointer}
    .tabs button.active{background:#f2f2f4;color:#111;border-color:#f2f2f4}
    .grid{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;padding:0 16px 10px;min-height:0}
    .bot{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;border-top:3px solid var(--accent)}
    .bot-head{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}
    .avatar{width:32px;height:32px;border-radius:11px;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:950;font-size:13px;flex:0 0 auto}
    .bot-name{font-weight:900;font-size:14px}
    .bot-model{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bot-head .meta{min-width:0;flex:1}
    .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 auto}
    .dot.on{background:#3ddc97}.dot.off{background:#ff4b67}
    .clear{border:0;background:transparent;color:#777;font-size:11px;cursor:pointer;padding:4px}
    .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:92%;padding:9px 12px;border-radius:15px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .msg.user{align-self:flex-end;background:#f1f1f3;color:#111;border-bottom-right-radius:5px}
    .msg.assistant{align-self:flex-start;background:#1e1e23;color:#e6e6e9;border-bottom-left-radius:5px}
    .msg.error{align-self:stretch;background:#261217;color:var(--red);border:1px solid #5c2631;font-size:12px}
    .msg.typing{color:#888;font-style:italic;background:transparent}
    .empty{margin:auto;text-align:center;color:#666;font-size:12px;line-height:1.5;padding:10px}
    .composer{padding:8px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid #1d1d22}
    .send-to{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px;font-size:11px;color:var(--muted)}
    .chip{border:1px solid #393940;background:#151518;color:#888;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:850;cursor:pointer}
    .chip.on{background:var(--accent,#f2f2f4);border-color:var(--accent,#f2f2f4);color:#111}
    .chip:disabled{opacity:.35;cursor:not-allowed}
    .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;border:1px solid #34343b;background:#1c1c1f;border-radius:20px;padding:6px}
    textarea{width:100%;min-height:46px;max-height:160px;border:0;outline:0;background:transparent;color:#fff;resize:none;padding:11px 10px;font-size:15px;line-height:1.4}
    .send{width:46px;height:46px;border:0;border-radius:15px;background:#f2f2f4;color:#111;font-size:20px;font-weight:950;cursor:pointer}
    .send:disabled{opacity:.35}
    .code-row{display:none;gap:8px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)}
    .code-row.show{display:flex}
    .code-row input{flex:1;max-width:260px;border:1px solid var(--line);background:#111114;color:#fff;border-radius:10px;padding:8px 10px;outline:0}
    .notice{font-size:11px;color:#e6c76e;margin-top:6px;min-height:0}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}}
    @media(max-width:700px){
      .tabs{display:flex}
      .grid{grid-template-columns:1fr;grid-auto-rows:1fr}
      .bot{display:none}.bot.active{display:flex}
      .head-actions .hide-small{display:none}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="orb" aria-hidden="true"><span>AI</span></div>
      <div><h1>My AIs</h1><div class="sub" id="statusText">Connecting…</div></div>
    </div>
    <div class="head-actions">
      <button class="pill" id="clearAllBtn" type="button">Clear all</button>
      <a class="pill hide-small" href="/ai-council/">AI Chat</a>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Choose which AI to view"></nav>
  <main class="grid" id="grid"></main>

  <div class="composer">
    <div class="send-to" id="sendTo"><span>Send to:</span></div>
    <div class="row">
      <textarea id="prompt" rows="1" placeholder="Message your AIs…" aria-label="Message"></textarea>
      <button class="send" id="sendBtn" type="button" aria-label="Send">↑</button>
    </div>
    <div class="code-row" id="codeRow"><label for="accessCode">Owner access code</label><input id="accessCode" type="password" autocomplete="off"></div>
    <div class="notice" id="notice" aria-live="polite"></div>
  </div>
</div>

<script>
(() => {
  // my-ais-hub-v1
  const STORE_KEY = 'my-ais-chats-v1';
  const SEND_KEY = 'my-ais-send-to-v1';
  const ACCENTS = { xai: 'var(--grok)', muse: 'var(--muse)', anthropic: 'var(--claude)', openai: 'var(--chatgpt)' };
  const els = {
    grid: document.getElementById('grid'), tabs: document.getElementById('tabs'), sendTo: document.getElementById('sendTo'),
    prompt: document.getElementById('prompt'), sendBtn: document.getElementById('sendBtn'), notice: document.getElementById('notice'),
    statusText: document.getElementById('statusText'), codeRow: document.getElementById('codeRow'), accessCode: document.getElementById('accessCode'),
    clearAllBtn: document.getElementById('clearAllBtn'),
  };

  let bots = [];
  let chats = load(STORE_KEY, {});
  let sendTo = new Set(load(SEND_KEY, []));
  let activeTab = '';
  const busy = new Set();

  function load(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v ?? fallback; } catch { return fallback; } }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(chats)); localStorage.setItem(SEND_KEY, JSON.stringify([...sendTo])); } catch {} }
  try { els.accessCode.value = sessionStorage.getItem('ai-council-access') || ''; if (els.accessCode.value) els.codeRow.classList.add('show'); } catch {}

  function history(id) { if (!Array.isArray(chats[id])) chats[id] = []; return chats[id]; }

  function renderShell() {
    els.grid.innerHTML = '';
    els.tabs.innerHTML = '';
    els.sendTo.querySelectorAll('.chip').forEach((chip) => chip.remove());
    const allChip = document.createElement('button');
    allChip.type = 'button'; allChip.className = 'chip'; allChip.textContent = 'All'; allChip.dataset.all = '1';
    allChip.onclick = () => {
      const ready = bots.filter((b) => b.configured).map((b) => b.id);
      const everyOn = ready.every((id) => sendTo.has(id));
      sendTo = new Set(everyOn ? [] : ready); save(); renderChips();
    };
    els.sendTo.append(allChip);

    for (const bot of bots) {
      const panel = document.createElement('section');
      panel.className = 'bot'; panel.id = `bot-${bot.id}`; panel.style.setProperty('--accent', ACCENTS[bot.id]);
      panel.innerHTML = `<div class="bot-head"><div class="avatar">${bot.name[0]}</div><div class="meta"><div class="bot-name"></div><div class="bot-model"></div></div><span class="dot ${bot.configured ? 'on' : 'off'}" title="${bot.configured ? 'Connected' : 'Not connected'}"></span><button class="clear" type="button">Clear</button></div><div class="msgs"></div>`;
      panel.querySelector('.bot-name').textContent = bot.name;
      panel.querySelector('.bot-model').textContent = bot.configured ? `${bot.maker} · ${bot.model}` : `${bot.maker} · not connected`;
      panel.querySelector('.clear').onclick = () => { chats[bot.id] = []; save(); renderMessages(bot.id); };
      els.grid.append(panel);

      const tab = document.createElement('button');
      tab.type = 'button'; tab.textContent = bot.name; tab.dataset.id = bot.id;
      tab.onclick = () => setTab(bot.id);
      els.tabs.append(tab);

      const chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'chip'; chip.textContent = bot.name; chip.dataset.id = bot.id;
      chip.style.setProperty('--accent', ACCENTS[bot.id]);
      chip.disabled = !bot.configured;
      chip.title = bot.configured ? '' : `${bot.name} is not connected yet`;
      chip.onclick = () => { sendTo.has(bot.id) ? sendTo.delete(bot.id) : sendTo.add(bot.id); save(); renderChips(); };
      els.sendTo.append(chip);

      renderMessages(bot.id);
    }
    setTab(activeTab || bots[0]?.id);
    renderChips();
  }

  function setTab(id) {
    activeTab = id;
    els.tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id));
    els.grid.querySelectorAll('.bot').forEach((p) => p.classList.toggle('active', p.id === `bot-${id}`));
  }

  function renderChips() {
    const ready = bots.filter((b) => b.configured).map((b) => b.id);
    for (const id of [...sendTo]) if (!ready.includes(id)) sendTo.delete(id);
    els.sendTo.querySelectorAll('.chip').forEach((chip) => {
      chip.classList.toggle('on', chip.dataset.all ? ready.length > 0 && ready.every((id) => sendTo.has(id)) : sendTo.has(chip.dataset.id));
    });
    const names = bots.filter((b) => sendTo.has(b.id)).map((b) => b.name);
    els.prompt.placeholder = names.length ? `Message ${names.join(', ')}…` : 'Pick who to send to above…';
  }

  function renderMessages(id) {
    const box = document.querySelector(`#bot-${id} .msgs`);
    if (!box) return;
    const bot = bots.find((b) => b.id === id);
    box.innerHTML = '';
    const list = history(id);
    if (!list.length && !busy.has(id)) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = bot.configured ? `Say hi to ${bot.name}.` : `${bot.name} isn't connected yet. Add its API key on the server to turn it on.`;
      box.append(empty);
    }
    for (const m of list) {
      const div = document.createElement('div');
      div.className = `msg ${m.role}`;
      div.textContent = m.content;
      box.append(div);
    }
    if (busy.has(id)) {
      const t = document.createElement('div');
      t.className = 'msg typing'; t.textContent = `${bot.name} is typing…`;
      box.append(t);
    }
    box.scrollTop = box.scrollHeight;
  }

  async function askBot(bot, code) {
    busy.add(bot.id); renderMessages(bot.id);
    // Error bubbles are display-only; never send them back as conversation history.
    const messages = history(bot.id).filter((m) => m.role !== 'error').map(({ role, content }) => ({ role, content }));
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (code) headers['x-ai-council-code'] = code;
      const res = await fetch('/api/ai-council/hub/chat', { method: 'POST', headers, body: JSON.stringify({ bot: bot.id, messages }) });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 || res.status === 503) { els.codeRow.classList.add('show'); throw new Error(data.error || 'Enter your owner access code below.'); }
      if (!res.ok || !data.ok) throw new Error(data.error || `Request failed (${res.status})`);
      history(bot.id).push({ role: 'assistant', content: data.text });
    } catch (e) {
      history(bot.id).push({ role: 'error', content: e.message || `${bot.name} could not answer.` });
    } finally {
      busy.delete(bot.id); save(); renderMessages(bot.id);
    }
  }

  async function send() {
    const text = els.prompt.value.trim();
    if (!text) return;
    const targets = bots.filter((b) => b.configured && sendTo.has(b.id) && !busy.has(b.id));
    if (!targets.length) { els.notice.textContent = 'Pick at least one connected AI to send to.'; return; }
    els.notice.textContent = '';
    const code = els.accessCode.value.trim();
    try { if (code) sessionStorage.setItem('ai-council-access', code); } catch {}
    for (const bot of targets) history(bot.id).push({ role: 'user', content: text });
    if (targets.length === 1) setTab(targets[0].id);
    els.prompt.value = ''; autosize(); save();
    els.sendBtn.disabled = true;
    await Promise.all(targets.map((bot) => askBot(bot, code)));
    els.sendBtn.disabled = false;
  }

  function autosize() { els.prompt.style.height = 'auto'; els.prompt.style.height = `${Math.min(els.prompt.scrollHeight, 160)}px`; }

  els.prompt.addEventListener('input', autosize);
  els.prompt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  els.sendBtn.onclick = send;
  els.clearAllBtn.onclick = () => { if (!confirm('Clear every conversation on this page?')) return; chats = {}; save(); bots.forEach((b) => renderMessages(b.id)); };

  fetch('/api/ai-council/hub/status', { cache: 'no-store' })
    .then((r) => r.json())
    .then((data) => {
      bots = Array.isArray(data.bots) ? data.bots : [];
      if (!sendTo.size) bots.filter((b) => b.configured).forEach((b) => sendTo.add(b.id));
      const ready = bots.filter((b) => b.configured).length;
      els.statusText.textContent = `${ready} of ${bots.length} connected`;
      renderShell();
    })
    .catch(() => { els.statusText.textContent = 'Could not reach the server'; });
})();
</script>
</body>
</html>
