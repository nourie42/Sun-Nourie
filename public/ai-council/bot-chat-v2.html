<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="color-scheme" content="dark">
  <title>Bot Chat</title>
  <link rel="stylesheet" href="/ai-council/ai-v2.css?v=2">
</head>
<body>
<div class="ai-app">
  <main class="ai-shell">
    <header class="ai-header">
      <div class="brand-wrap">
        <a class="icon-btn" href="/ai-council/bots/" aria-label="Back to Bots">←</a>
        <div class="bot-avatar" id="chatAvatar" style="--bot:#8b46ff">AI</div>
        <div><div class="brand-title" id="chatName">Bot Chat</div><div class="brand-sub" id="chatSub">Loading bot…</div></div>
      </div>
      <div class="header-actions">
        <a class="pill-btn" href="/ai-council/">AI Chat</a>
        <button class="icon-btn" id="editBtn" type="button" aria-label="Edit bot">⚙</button>
        <button class="icon-btn" id="newBotChatBtn" type="button" aria-label="New chat">＋</button>
      </div>
    </header>

    <div class="page-nav">
      <a class="back-btn" href="/ai-council/bots/">← Bots</a>
      <button id="hotRoomBtn" type="button">🔥 Add to Hot Room</button>
    </div>

    <div id="toolStatus" class="tool-badges"></div>
    <div id="chatNotice"></div>

    <section class="panel active">
      <div class="chat-empty" id="emptyState">
        <div class="mark" id="emptyMark">🤖</div>
        <h1 id="emptyTitle">Talk to your bot</h1>
        <p id="emptyText">Ask it anything. Its job, personality, and tools come from the way you set it up.</p>
      </div>
      <div class="messages" id="messages"></div>
    </section>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <div class="composer-tools"><span class="tool-chip active" id="providerChip">AI</span><span class="tool-chip hidden" id="webChip">🌐 Internet Search</span></div>
      <div class="compose-row"><textarea id="prompt" rows="1" placeholder="Message this bot…"></textarea><button class="send-btn" id="sendBtn" type="button">↑</button></div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="accessBack"></div>
<aside class="sheet" id="accessSheet" aria-hidden="true">
  <div class="sheet-handle"></div><h2 class="sheet-title">Access code</h2>
  <p style="color:#8b8b94;font-size:12px">Enter it once for this browser session.</p>
  <div class="field"><label>Access code</label><input id="accessCode" type="password" autocomplete="off"></div>
  <div class="actions"><button class="secondary" id="cancelAccessBtn" type="button">Cancel</button><button class="primary" id="saveAccessBtn" type="button">Save</button></div>
</aside>

<script src="/ai-council/ai-context-v1.js?v=2" defer></script>
<script src="/ai-council/bot-chat-v2.js?v=3" defer></script>
</body>
</html>
