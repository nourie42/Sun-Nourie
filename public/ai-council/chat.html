<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0d0f">
  <title>AI Bots · Chat</title>
  <style>
    :root{--bg:#0d0d0f;--surface:#151518;--surface2:#1c1c20;--line:#2b2b31;--text:#f5f5f7;--muted:#92929b;--muted2:#686870;--green:#00c877;--blue:#1687ff;--red:#ff2146}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.hidden{display:none!important}
    .app{min-height:100vh}.shell{width:min(780px,100%);margin:0 auto;padding:12px 14px 108px}.header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 82%,rgba(13,13,15,0));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:3px 0 14px}.round{width:48px;height:48px;border:1px solid #36363d;background:#1a1a1e;color:#fff;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:22px}.title{font-size:24px;font-weight:900;letter-spacing:-.035em}.sub{color:var(--muted2);font-size:11px;margin-top:2px}.status{width:10px;height:10px;border-radius:50%;display:inline-block;background:#777;margin-right:7px}.status.on{background:var(--green);box-shadow:0 0 12px rgba(0,200,119,.45)}
    .view{display:none}.view.active{display:block}.botList{display:flex;flex-direction:column}.botRow{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 3px;border-radius:17px}.botRow+.botRow{border-top:1px solid rgba(255,255,255,.035)}.botRow:active{background:#151518}.avatar{width:58px;height:58px;border-radius:21px 21px 21px 13px;display:grid;place-items:center;color:#111;font-weight:950;font-size:14px;position:relative;overflow:hidden}.avatar:before,.avatar:after{content:"";position:absolute;width:5px;height:12px;border-radius:99px;background:#17171a;top:21px}.avatar:before{left:23px;transform:rotate(-13deg)}.avatar:after{left:33px;transform:rotate(13deg)}.botName{font-size:18px;font-weight:850}.botPreview{margin-top:5px;color:#8f8f98;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{align-self:start;padding-top:5px;color:#62626a;font-size:12px;text-align:right;white-space:nowrap}.empty{padding:70px 22px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#fff;font-size:20px;margin-bottom:8px}.empty a{display:inline-block;margin-top:14px;background:#f1f1f4;color:#111;text-decoration:none;padding:11px 14px;border-radius:13px;font-weight:900}
    .chatHeader{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:4px 0 12px;border-bottom:1px solid #222228}.chatAvatar{width:48px;height:48px;border-radius:17px 17px 17px 11px;display:grid;place-items:center;color:#111;font-size:12px;font-weight:950}.chatName{font-size:19px;font-weight:900}.chatRole{font-size:11px;color:var(--muted2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{border:1px solid #33333a;background:#18181c;color:#ddd;border-radius:12px;padding:9px 10px;font-weight:850;font-size:11px}.messages{padding:18px 0 150px;display:flex;flex-direction:column;gap:12px}.message{max-width:88%;border-radius:18px;padding:12px 14px;line-height:1.52;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#f0f0f3;color:#111;border-bottom-right-radius:7px}.message.bot{align-self:flex-start;background:#18181c;border:1px solid #292930;color:#e3e3e8;border-bottom-left-radius:7px}.message.thinking{color:#777;font-style:italic}.msgMeta{font-size:9px;color:#65656d;margin:4px 4px 0}.msgWrap.user{align-self:flex-end;text-align:right}.msgWrap.bot{align-self:flex-start}.sources{margin-top:9px;padding-top:8px;border-top:1px solid #2d2d33}.sources a{display:block;color:#79b9ff;text-decoration:none;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
    .composer{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 16px));background:rgba(21,21,24,.97);backdrop-filter:blur(18px);border:1px solid #303037;border-radius:22px;padding:9px;z-index:30;box-shadow:0 18px 50px rgba(0,0,0,.45)}.composeTop{display:grid;grid-template-columns:1fr auto;gap:8px}.prompt{width:100%;min-height:48px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:11px 10px;line-height:1.45}.send{width:48px;height:48px;border:0;border-radius:16px;background:#f2f2f4;color:#111;font-size:20px;font-weight:950}.send:disabled{opacity:.4}.composeBottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;padding:4px 6px 1px}.code{border:1px solid #2c2c32;background:#101013;color:#ddd;border-radius:10px;padding:8px 9px;min-width:0;width:100%;font-size:11px}.provider{font-size:10px;color:#777;white-space:nowrap}.toolbar{display:flex;gap:8px;margin:12px 0}.tool{border:1px solid #303036;background:#17171b;color:#aaa;border-radius:999px;padding:8px 10px;font-size:10px;font-weight:850}.tool.active{color:#fff;border-color:#505058}.warning{border:1px solid rgba(255,33,70,.24);background:rgba(255,33,70,.07);color:#ff99aa;padding:10px 12px;border-radius:13px;font-size:11px;line-height:1.45;margin:10px 0}
    @media(max-width:560px){.shell{padding-left:12px;padding-right:12px}.message{max-width:92%}.title{font-size:22px}}
  </style>
</head>
<body>
<div class="app">
  <main class="shell">
    <header class="header" id="mainHeader">
      <a class="round" href="/ai-council/bots/" aria-label="Back to Bots">‹</a>
      <div><div class="title">Bot Chat</div><div class="sub"><span class="status" id="statusDot"></span><span id="statusText">Checking AI providers…</span></div></div>
      <a class="round" href="/ai-council/bots/" aria-label="Hot Room">🔥</a>
    </header>

    <section class="view active" id="listView">
      <div class="toolbar"><a class="tool" href="/ai-council/bots/" style="text-decoration:none">Bots & Hot Room</a><button class="tool" id="clearAllBtn" type="button">Clear all chats</button></div>
      <div class="botList" id="botList"></div>
    </section>

    <section class="view" id="chatView">
      <div class="chatHeader">
        <button class="round" id="backBtn" type="button" aria-label="Back">‹</button>
        <div><div class="chatName" id="chatName"></div><div class="chatRole" id="chatRole"></div></div>
        <button class="more" id="hotRoomBtn" type="button">+ Hot Room</button>
      </div>
      <div class="warning hidden" id="warning"></div>
      <div class="messages" id="messages"></div>
    </section>
  </main>

  <div class="composer hidden" id="composer">
    <div class="composeTop"><textarea class="prompt" id="prompt" rows="1" placeholder="Message this bot…"></textarea><button class="send" id="sendBtn" type="button">↑</button></div>
    <div class="composeBottom"><input class="code" id="accessCode" type="password" autocomplete="off" placeholder="Owner access code"><span class="provider" id="providerLabel"></span></div>
  </div>
</div>
<script>
  const BOT_KEY='ai-council-bots-v1';
  const CHAT_KEY='ai-council-single-chat-v1';
  const ACTIVITY_KEY='ai-council-bot-activity-v1';
  const SELECTED_KEY='ai-council-selected-bots-v1';
  const COLORS=['#1687ff','#ff2146','#00c877','#8b46ff','#ff6d00','#9a6238','#f2ca36','#ff72b6'];
  let bots=loadBots();let chats=loadChats();let providers=[];let currentBot=null;let sending=false;
  const els={statusDot:document.getElementById('statusDot'),statusText:document.getElementById('statusText'),listView:document.getElementById('listView'),chatView:document.getElementById('chatView'),botList:document.getElementById('botList'),chatName:document.getElementById('chatName'),chatRole:document.getElementById('chatRole'),messages:document.getElementById('messages'),composer:document.getElementById('composer'),prompt:document.getElementById('prompt'),sendBtn:document.getElementById('sendBtn'),accessCode:document.getElementById('accessCode'),providerLabel:document.getElementById('providerLabel'),backBtn:document.getElementById('backBtn'),hotRoomBtn:document.getElementById('hotRoomBtn'),warning:document.getElementById('warning'),clearAllBtn:document.getElementById('clearAllBtn')};
  try{els.accessCode.value=sessionStorage.getItem('ai-council-access')||''}catch{}
  function safeArray(v){return Array.isArray(v)?v:[]}
  function loadBots(){try{return safeArray(JSON.parse(localStorage.getItem(BOT_KEY)||'[]')).filter(b=>b&&b.id&&b.name&&b.provider)}catch{return[]}}
  function loadChats(){try{const v=JSON.parse(localStorage.getItem(CHAT_KEY)||'{}');return v&&typeof v==='object'?v:{}}catch{return{}}}
  function saveChats(){localStorage.setItem(CHAT_KEY,JSON.stringify(chats))}
  function initials(name){return String(name||'AI').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'AI'}
  function hash(text){let h=0;for(const c of String(text))h=((h<<5)-h)+c.charCodeAt(0)|0;return h}
  function color(bot){return bot?.color||COLORS[Math.abs(hash(bot?.id||''))%COLORS.length]}
  function fmt(ts){if(!ts)return'';const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});const y=new Date(n);y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString([],{weekday:'short'})}
  function botChat(bot){return safeArray(chats[bot.id]).slice(-40)}
  function latest(bot){return botChat(bot).at(-1)}
  function configured(bot){return providers.find(p=>p.id===bot.provider)?.configured===true}
  function pLabel(bot){const p=providers.find(p=>p.id===bot.provider);return p?`${p.label} · ${p.model}`:bot.provider}
  function warn(text){els.warning.textContent=text||'';els.warning.classList.toggle('hidden',!text)}
  function renderList(){els.botList.replaceChildren();if(!bots.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>No bots yet</strong>Create a bot first, then come back here for a private 1-on-1 chat.<br><a href="/ai-council/bots/">Create a Bot</a>';els.botList.append(e);return}bots.forEach(bot=>{const last=latest(bot);const row=document.createElement('button');row.type='button';row.className='botRow';row.style.border='0';row.style.background='transparent';row.style.color='inherit';row.style.width='100%';row.style.textAlign='left';const av=document.createElement('div');av.className='avatar';av.style.background=color(bot);av.textContent=initials(bot.name);const main=document.createElement('div');const name=document.createElement('div');name.className='botName';name.textContent=bot.name;const prev=document.createElement('div');prev.className='botPreview';prev.textContent=last?.text||bot.role||'Ask this bot anything';main.append(name,prev);const meta=document.createElement('div');meta.className='meta';meta.textContent=fmt(last?.at);row.append(av,main,meta);row.addEventListener('click',()=>openChat(bot.id));els.botList.append(row)})}
  function openChat(id){const bot=bots.find(b=>b.id===id);if(!bot)return;currentBot=bot;els.listView.classList.remove('active');els.chatView.classList.add('active');els.composer.classList.remove('hidden');els.chatName.textContent=bot.name;els.chatRole.textContent=`${bot.role||'General expert'} · ${pLabel(bot)}`;els.providerLabel.textContent=configured(bot)?pLabel(bot):'Not connected';warn(configured(bot)?'':`${pLabel(bot)} is not configured yet.`);renderMessages();history.replaceState(null,'',`/ai-council/chat.html?bot=${encodeURIComponent(bot.id)}`);setTimeout(()=>els.prompt.focus(),100)}
  function closeChat(){currentBot=null;els.chatView.classList.remove('active');els.listView.classList.add('active');els.composer.classList.add('hidden');warn('');history.replaceState(null,'','/ai-council/chat.html');renderList()}
  function renderMessages(){els.messages.replaceChildren();const msgs=botChat(currentBot);if(!msgs.length){const e=document.createElement('div');e.className='empty';e.innerHTML=`<strong>Chat with ${escapeHtml(currentBot.name)}</strong><span>${escapeHtml(currentBot.role||'Ask this bot anything.')}</span>`;els.messages.append(e);return}msgs.forEach(m=>{const wrap=document.createElement('div');wrap.className=`msgWrap ${m.role==='user'?'user':'bot'}`;const bubble=document.createElement('div');bubble.className=`message ${m.role==='user'?'user':'bot'}`;bubble.textContent=m.text;wrap.append(bubble);if(safeArray(m.citations).length){const src=document.createElement('div');src.className='sources';m.citations.forEach((url,i)=>{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=`Source ${i+1}: ${url}`;src.append(a)});bubble.append(src)}const meta=document.createElement('div');meta.className='msgMeta';meta.textContent=fmt(m.at);wrap.append(meta);els.messages.append(wrap)});requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function compactHistory(msgs){return msgs.slice(-12).map(m=>`${m.role==='user'?'User':currentBot.name}: ${m.text}`).join('\n\n').slice(-12000)}
  function buildQuestion(userText){const existing=botChat(currentBot);const transcript=compactHistory(existing);return [`You are ${currentBot.name}, a reusable personal AI bot.`,`Your role: ${currentBot.role||'General expert'}.`,`Your custom instructions: ${currentBot.instructions||'Be accurate and useful.'}`,`Stay in character as this bot. Answer the user directly. Do not discuss the AI Council or other bots unless the user asks.`,`Conversation so far:\n${transcript||'(new conversation)'}`,`User's new message:\n${userText}`].join('\n\n')}
  async function send(){if(sending||!currentBot)return;const text=els.prompt.value.trim(),code=els.accessCode.value.trim();if(!text)return;if(!code)return warn('Enter the owner access code below the message box.');if(!configured(currentBot))return warn(`${pLabel(currentBot)} is not connected.`);try{sessionStorage.setItem('ai-council-access',code)}catch{}warn('');const arr=botChat(currentBot);arr.push({role:'user',text,at:Date.now()});chats[currentBot.id]=arr;saveChats();els.prompt.value='';renderMessages();sending=true;els.sendBtn.disabled=true;const thinking=document.createElement('div');thinking.className='message bot thinking';thinking.id='thinkingBubble';thinking.textContent=`${currentBot.name} is thinking…`;els.messages.append(thinking);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});try{const response=await fetch('/api/ai-council/ask',{method:'POST',headers:{'Content-Type':'application/json','x-ai-council-code':code},body:JSON.stringify({question:buildQuestion(text),providers:[currentBot.provider]})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);const answer=safeArray(data.answers).find(a=>a.ok&&a.id===currentBot.provider)||safeArray(data.answers).find(a=>a.ok);if(!answer)throw new Error(safeArray(data.answers)[0]?.error||'This bot did not return an answer.');const now=Date.now();const latestArr=botChat(currentBot);latestArr.push({role:'bot',text:answer.text,at:now,citations:answer.citations||[]});chats[currentBot.id]=latestArr;saveChats();updateActivity(currentBot,answer.text,now);renderMessages()}catch(e){warn(e.message||'The bot could not answer.')}finally{document.getElementById('thinkingBubble')?.remove();sending=false;els.sendBtn.disabled=false;renderList()}}
  function updateActivity(bot,text,at){try{const a=JSON.parse(localStorage.getItem(ACTIVITY_KEY)||'{}')||{};a[bot.id]={at,preview:String(text).slice(0,180)};localStorage.setItem(ACTIVITY_KEY,JSON.stringify(a))}catch{}}
  function addToHotRoom(){if(!currentBot)return;try{const ids=new Set(safeArray(JSON.parse(localStorage.getItem(SELECTED_KEY)||'[]')));ids.add(currentBot.id);localStorage.setItem(SELECTED_KEY,JSON.stringify([...ids]));location.href='/ai-council/bots/'}catch{location.href='/ai-council/bots/'}}
  async function loadStatus(){try{const r=await fetch('/api/ai-council/status',{cache:'no-store'});const d=await r.json();providers=safeArray(d.providers);const n=providers.filter(p=>p.configured).length;els.statusText.textContent=`${n} of ${providers.length} AI providers connected`;els.statusDot.classList.toggle('on',n>0);renderList();const q=new URLSearchParams(location.search).get('bot');if(q)openChat(q)}catch{els.statusText.textContent='Could not load provider status';renderList()}}
  els.backBtn.addEventListener('click',closeChat);els.hotRoomBtn.addEventListener('click',addToHotRoom);els.sendBtn.addEventListener('click',send);els.prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});els.clearAllBtn.addEventListener('click',()=>{if(confirm('Clear every 1-on-1 bot conversation on this device?')){chats={};saveChats();renderList()}});window.addEventListener('popstate',()=>{if(currentBot)closeChat()});
  loadStatus();renderList();
</script>
</body>
</html>
