<!doctype html><html lang="en" data-member="Christian" style="--member:#1687ff"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0f"><title>Christian · AI Bots</title><link rel="stylesheet" href="/ai-council/family.css"></head><body><main class="shell"><section id="lock"><div class="card lockCard"><div class="avatar">C</div><h1><span data-member-name>Christian</span>'s Bots</h1><p>This is a private bot workspace. Your secret key encrypts your bots and chat history on this device.</p><div id="setup"><div class="field"><label>Create secret key</label><input id="setup-secret" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm secret key</label><input id="setup-confirm" type="password" autocomplete="new-password"></div><div class="field"><label>Owner setup code · one time only</label><input id="owner-code" type="password" autocomplete="off"></div><div class="actions"><button class="primary" id="create-vault">Create My Private Page</button></div></div><div id="unlock" class="hidden"><div class="field"><label>Secret key</label><input id="unlock-secret" type="password" autocomplete="current-password"></div><div class="actions"><button class="primary" id="unlock-btn">Unlock</button></div></div><div class="error" id="lock-error"></div></div></section><section id="workspace" class="hidden"><header class="top"><div class="avatar">C</div><div><div class="title"><span data-member-name>Christian</span>'s Bots</div><div class="sub" id="provider-status">Checking AI providers…</div></div><button class="round" id="lock-btn" title="Lock">⌁</button></header><div class="banner">🚧 Under Construction</div><section id="bots-view"><div class="toolbar"><button class="pill active">My Bots</button><button class="pill" id="new-bot">＋ Create Bot</button><button class="pill" id="change-key">Change Secret Key</button></div><div class="botList" id="bots"></div></section><section id="chat-view" class="hidden"><div class="chatHead"><button class="round" id="back-bots">‹</button><div><div class="chatName" id="chat-title"></div><div class="chatRole" id="chat-role"></div></div><button class="pill" id="edit-active">Edit</button></div><div class="messages" id="messages"></div></section></section></main><div class="composer hidden" id="composer"><textarea id="prompt" rows="1" placeholder="Ask this bot anything…"></textarea><button class="send" id="send">↑</button></div><div class="sheetBack" id="sheet-back"></div><aside class="sheet" id="sheet"><h2 id="sheet-title">Create Bot</h2><div class="field"><label>Bot name</label><input id="bot-name" maxlength="60"></div><div class="field"><label>Role</label><input id="bot-role" maxlength="180"></div><div class="field"><label>AI provider</label><select id="bot-provider"></select></div><div class="field"><label>Avatar color</label><div class="palette" id="palette"></div></div><div class="field"><label>Custom instructions</label><textarea id="bot-instructions" maxlength="3500"></textarea></div><div class="actions"><button class="danger hidden" id="delete-bot">Delete</button><button class="secondary" id="cancel-bot">Cancel</button><button class="primary" id="save-bot">Save Bot</button></div></aside><script src="/ai-council/family.js"></script></body></html>
